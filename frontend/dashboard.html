<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CRISMATECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        :root {
            --navy-900: #0d1b36;
            --navy-800: #13264a;
            --surface: #ffffff;
            --bg: #f3f6fb;
            --text: #1f2b46;
            --muted: #6f7f9f;
            --line: #e6ecf5;
            --blue: #2f6bff;
            --green: #1da772;
            --amber: #c07a0b;
            --shadow: 0 12px 30px rgba(17, 40, 89, 0.08);
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

        .shell { min-height: 100vh; display: grid; grid-template-columns: 250px 1fr; }
        .sidebar {
            background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
            color: #dce6ff;
            padding: 22px 14px;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .brand { padding: 10px 12px 22px; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 14px; }
        .brand h1 { font-size: 1.05rem; color: #fff; }
        .brand p { color: #9fb1d8; font-size: 0.78rem; margin-top: 6px; }
        .nav a {
            display: flex; align-items: center; gap: 10px;
            color: #cad7f7; text-decoration: none; padding: 11px 12px;
            border-radius: 10px; margin-bottom: 4px; font-weight: 500; font-size: 0.92rem;
            transition: 0.2s ease;
        }
        .nav a:hover, .nav a.active { background: rgba(255,255,255,0.14); color: #fff; }

        .main { padding: 24px; }
        .topbar {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .welcome h2 { font-size: 1.28rem; }
        .welcome p { margin-top: 5px; color: var(--muted); font-size: 0.88rem; }
        .search {
            display: flex; align-items: center; gap: 8px;
            background: #f8faff; border: 1px solid var(--line);
            border-radius: 10px; padding: 8px 10px; width: 240px; color: var(--muted);
        }
        .search input { border: 0; outline: 0; width: 100%; background: transparent; font-family: inherit; }

        .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 14px; }
        .stat {
            background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
            padding: 14px; box-shadow: var(--shadow);
        }
        .stat small { color: var(--muted); }
        .stat strong { display: block; margin-top: 6px; font-size: 1.45rem; color: var(--blue); }

        .layout {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 12px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 14px;
        }
        .panel h3 { font-size: 1rem; margin-bottom: 10px; }

        .cards { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
        .course {
            border-radius: 12px;
            padding: 11px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .course:nth-child(1) { background: #d8ecff; }
        .course:nth-child(2) { background: #dff7eb; }
        .course:nth-child(3) { background: #ffeecf; }
        .course h4 { font-size: 0.9rem; }
        .course p { font-size: 0.78rem; color: #42557f; margin-top: 5px; }
        .meta { display: flex; justify-content: space-between; color: #2f436f; font-size: 0.76rem; }

        .list { display: flex; flex-direction: column; gap: 9px; }
        .item {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .item strong { font-size: 0.9rem; }
        .item small { color: var(--muted); font-size: 0.76rem; }

        .pill { padding: 5px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
        .ok { background: #dbf6eb; color: var(--green); }
        .wait { background: #ffeecf; color: var(--amber); }
        .plan { background: #eaf0ff; color: #244792; }

        @media (max-width: 1100px) {
            .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
            .layout { grid-template-columns: 1fr; }
            .cards { grid-template-columns: 1fr; }
        }
        @media (max-width: 820px) {
            .shell { grid-template-columns: 1fr; }
            .sidebar { position: static; height: auto; }
            .main { padding: 14px; }
            .topbar { flex-direction: column; align-items: flex-start; }
            .search { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="brand">
                <h1><i class="bi bi-mortarboard-fill"></i> CRISMATECH</h1>
                <p>Student Learning Portal</p>
            </div>
            <nav class="nav">
                <a href="index.html"><i class="bi bi-house-door"></i> Home</a>
                <a class="active" href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
                <a href="courses/courses.html"><i class="bi bi-journal-bookmark"></i> Courses</a>
                <a href="assignments/assignments.html"><i class="bi bi-file-earmark-check"></i> Assignments</a>
                <a href="tests/test.html"><i class="bi bi-ui-checks-grid"></i> Tests</a>
                <a href="certificate/certificate.html"><i class="bi bi-award"></i> Certificates</a>
                <a href="profile/profile.html"><i class="bi bi-person"></i> Profile</a>
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </nav>
        </aside>

        <main class="main">
            <section class="topbar">
                <div class="welcome">
                    <h2>Welcome back, <span id="userName">Student</span></h2>
                    <p>Here is your live learning overview for this week.</p>
                </div>
                <label class="search">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="Search courses, tasks, tests...">
                </label>
            </section>

            <section class="stats">
                <div class="stat"><small>Courses Enrolled</small><strong id="enrolledCount">0</strong></div>
                <div class="stat"><small>Completed</small><strong id="completedCount">0</strong></div>
                <div class="stat"><small>Certificates</small><strong id="certificateCount">0</strong></div>
                <div class="stat"><small>Average Progress</small><strong id="avgProgress">0%</strong></div>
            </section>

            <section class="layout">
                <div class="panel">
                    <h3>Continue Learning</h3>
                    <div id="continueCourses" class="cards">
                    </div>
                </div>

                <div class="panel">
                    <h3>Recent Activity</h3>
                    <div id="recentActivity" class="list">
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const API_CANDIDATES = [5000, 5001, 5002, 5003, 5004, 5005].map(
            (port) => `http://${window.location.hostname || 'localhost'}:${port}/api`
        );

        let apiBase = null;

        async function getApiBase() {
            if (apiBase) return apiBase;
            for (const base of API_CANDIDATES) {
                try {
                    const res = await fetch(`${base}/courses`);
                    if (res.ok) {
                        apiBase = base;
                        return apiBase;
                    }
                } catch (_) {
                    // Try next candidate.
                }
            }
            throw new Error('Unable to connect to backend API (ports 5000-5005).');
        }

        async function fetchFromApi(path) {
            const base = await getApiBase();
            const res = await fetch(`${base}${path}`);
            if (!res.ok) {
                const errorText = await res.text();
                throw new Error(errorText || `Request failed with status ${res.status}`);
            }
            return await res.json();
        }

        function loadUserName() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && user.name) {
                document.getElementById('userName').textContent = user.name.split(' ')[0];
            }
        }

        function renderCourses(courses) {
            const container = document.getElementById('continueCourses');
            if (!courses.length) {
                container.innerHTML = '<div class="item"><small>No courses available yet.</small></div>';
                return;
            }

            container.innerHTML = courses
                .slice(0, 3)
                .map((course) => {
                    const lessons = Number(course.lessons) || 0;
                    const progress = Math.min(100, Math.max(10, lessons * 4));
                    return `
                        <article class="course">
                            <div>
                                <h4>${course.title}</h4>
                                <p>${course.instructor || 'Instructor'}</p>
                            </div>
                            <div class="meta"><span>${progress}% complete</span><span>${lessons} lessons</span></div>
                        </article>
                    `;
                })
                .join('');
        }

        function renderRecent(assignments, tests, certificates) {
            const container = document.getElementById('recentActivity');
            const activities = [];

            assignments.slice(0, 1).forEach((a) => {
                const dueText = a.dueDate ? new Date(a.dueDate).toLocaleDateString() : 'No due date';
                activities.push({ title: 'Assignment Update', subtitle: `${a.title} • Due ${dueText}`, type: 'wait', label: 'Review' });
            });

            tests.slice(0, 1).forEach((t) => {
                const testText = t.scheduledDate ? new Date(t.scheduledDate).toLocaleDateString() : 'No schedule';
                activities.push({ title: 'Upcoming Test', subtitle: `${t.title} • ${testText}`, type: 'plan', label: 'Planned' });
            });

            certificates
                .filter((c) => c.status === 'earned')
                .slice(0, 1)
                .forEach((c) => {
                    activities.push({ title: 'Certificate Earned', subtitle: c.title, type: 'ok', label: 'Done' });
                });

            if (!activities.length) {
                container.innerHTML = '<div class="item"><small>No recent activity yet.</small></div>';
                return;
            }

            container.innerHTML = activities
                .map(
                    (activity) => `
                        <div class="item">
                            <div>
                                <strong>${activity.title}</strong><br>
                                <small>${activity.subtitle}</small>
                            </div>
                            <span class="pill ${activity.type}">${activity.label}</span>
                        </div>
                    `
                )
                .join('');
        }

        function updateStats(courses, tests, certificates) {
            const earnedCertificates = certificates.filter((c) => c.status === 'earned').length;
            const progressValues = certificates.map((c) => {
                if (c.status === 'earned') return 100;
                if (typeof c.progressPercent === 'number') return c.progressPercent;
                if (c.status === 'inProgress') return 50;
                return 0;
            });
            const avgProgress = progressValues.length
                ? Math.round(progressValues.reduce((sum, value) => sum + value, 0) / progressValues.length)
                : 0;

            document.getElementById('enrolledCount').textContent = courses.length;
            document.getElementById('completedCount').textContent = earnedCertificates;
            document.getElementById('certificateCount').textContent = certificates.length;
            document.getElementById('avgProgress').textContent = `${avgProgress}%`;
        }

        async function loadDashboardData() {
            try {
                const [coursesRes, assignmentsRes, testsRes, certificatesRes] = await Promise.all([
                    fetchFromApi('/courses'),
                    fetchFromApi('/assignments'),
                    fetchFromApi('/tests'),
                    fetchFromApi('/certificates'),
                ]);

                const courses = Array.isArray(coursesRes.courses) ? coursesRes.courses : [];
                const assignments = Array.isArray(assignmentsRes.assignments) ? assignmentsRes.assignments : [];
                const tests = Array.isArray(testsRes.tests) ? testsRes.tests : [];
                const certificates = Array.isArray(certificatesRes.certificates) ? certificatesRes.certificates : [];

                updateStats(courses, tests, certificates);
                renderCourses(courses);
                renderRecent(assignments, tests, certificates);
            } catch (error) {
                console.error('Dashboard data load failed:', error.message);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUserName();
            loadDashboardData();
        });
    </script>
</body>
</html>
