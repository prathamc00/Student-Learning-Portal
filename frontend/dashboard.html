<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — CRISMATECH</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        .shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 260px 1fr;
        }

        .main {
            padding: var(--sp-6);
            overflow-y: auto;
            background: var(--c-bg);
        }

        /* ─── Welcome Banner ─── */
        .welcome-bar {
            background: var(--c-primary-gradient);
            background-size: 200% 200%;
            animation: gradientShift 6s ease infinite;
            border-radius: var(--r-xl);
            padding: var(--sp-6) var(--sp-8);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--sp-6);
            position: relative;
            overflow: hidden;
        }

        .welcome-bar::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, .08);
            border-radius: 50%;
            top: -60px;
            right: 40px;
            animation: float 5s ease-in-out infinite;
        }

        .welcome-bar h2 {
            font-size: var(--fs-xl);
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .welcome-bar p {
            color: rgba(255, 255, 255, .8);
            font-size: var(--fs-base);
            margin-top: var(--sp-1);
            position: relative;
            z-index: 1;
        }

        .search {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            background: rgba(255, 255, 255, .15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: var(--r-md);
            padding: 10px 14px;
            min-width: 240px;
            position: relative;
            z-index: 1;
        }

        .search i {
            color: rgba(255, 255, 255, .7);
        }

        .search input {
            border: 0;
            outline: 0;
            width: 100%;
            background: transparent;
            font-family: var(--font);
            color: #fff;
            font-size: var(--fs-base);
        }

        .search input::placeholder {
            color: rgba(255, 255, 255, .5);
        }

        /* ─── Stats Grid ─── */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--sp-4);
            margin-bottom: var(--sp-6);
        }

        /* ─── Content Layout ─── */
        .layout {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: var(--sp-5);
        }

        .panel {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-sm);
            padding: var(--sp-5);
            animation: slideUp .5s var(--ease) both;
        }

        .panel h3 {
            font-size: var(--fs-lg);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            margin-bottom: var(--sp-5);
        }

        .panel h3 i {
            color: var(--c-primary);
        }

        /* Course Items */
        .course {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--sp-4);
            border: 1px solid var(--c-border-light);
            border-radius: var(--r-md);
            margin-bottom: var(--sp-3);
            cursor: pointer;
            transition: all .25s var(--ease);
        }

        .course:hover {
            border-color: var(--c-primary);
            box-shadow: var(--shadow-md);
            transform: translateX(4px);
        }

        .course h4 {
            font-size: var(--fs-base);
            font-weight: 600;
            margin-bottom: 2px;
        }

        .course p {
            color: var(--c-text-muted);
            font-size: var(--fs-sm);
            margin: 0;
        }

        .meta {
            display: flex;
            gap: var(--sp-4);
            font-size: var(--fs-sm);
            color: var(--c-text-secondary);
        }

        .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Activity items */
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--sp-4);
            border: 1px solid var(--c-border-light);
            border-radius: var(--r-md);
            margin-bottom: var(--sp-3);
            transition: all .2s var(--ease);
        }

        .item:hover {
            background: var(--c-primary-light);
        }

        .item strong {
            font-size: var(--fs-base);
            font-weight: 600;
        }

        .item small {
            color: var(--c-text-muted);
            font-size: var(--fs-sm);
        }

        .pill {
            padding: 4px 12px;
            border-radius: var(--r-full);
            font-size: var(--fs-xs);
            font-weight: 600;
        }

        .pill.wait {
            background: var(--c-warning-light);
            color: #92400E;
        }

        .pill.plan {
            background: var(--c-info-light);
            color: #1E40AF;
        }

        .pill.ok {
            background: var(--c-success-light);
            color: #065F46;
        }

        /* Skeleton (shown during load) */
        .skeleton-row {
            display: flex;
            gap: var(--sp-4);
            padding: var(--sp-4);
            border: 1px solid var(--c-border-light);
            border-radius: var(--r-md);
            margin-bottom: var(--sp-3);
        }

        @media (max-width: 1024px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .shell {
                grid-template-columns: 1fr;
            }

            .sidebar-modern {
                display: none;
            }

            .main {
                padding: var(--sp-4);
            }

            .welcome-bar {
                flex-direction: column;
                gap: var(--sp-4);
                text-align: center;
            }

            .search {
                min-width: 100%;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <aside class="sidebar-modern">
            <div class="brand">
                <h4><i class="bi bi-mortarboard-fill"></i> CRISMATECH</h4>
                <small>Learning Portal</small>
            </div>
            <nav>
                <a class="active" href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
                <a href="profile/profile.html"><i class="bi bi-person"></i> Profile</a>
                <a href="courses/courses.html"><i class="bi bi-journal-bookmark"></i> Courses</a>
                <a href="assignments/assignments.html"><i class="bi bi-file-earmark-check"></i> Assignments</a>
                <a href="tests/test.html"><i class="bi bi-ui-checks-grid"></i> Tests</a>
                <a href="certificate/certificate.html"><i class="bi bi-award"></i> Certificates</a>
                <a href="attendance/attendance.html"><i class="bi bi-calendar-check"></i> Attendance</a>
                <div class="nav-divider"></div>
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </nav>
        </aside>

        <main class="main page-fade">
            <!-- Welcome -->
            <section class="welcome-bar">
                <div>
                    <h2>Welcome back, <span id="userName">Student</span> 👋</h2>
                    <p>Here's your learning overview for this week</p>
                </div>
                <label class="search">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="Search courses, tasks...">
                </label>
            </section>

            <!-- Stats -->
            <section class="stats stagger">
                <div class="stat-card-modern slide-up">
                    <div class="stat-icon-wrap indigo"><i class="bi bi-journal-bookmark"></i></div>
                    <div>
                        <div class="stat-value" id="enrolledCount">0</div>
                        <div class="stat-label">Courses Enrolled</div>
                    </div>
                </div>
                <div class="stat-card-modern slide-up">
                    <div class="stat-icon-wrap emerald"><i class="bi bi-check-circle"></i></div>
                    <div>
                        <div class="stat-value" id="completedCount">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                </div>
                <div class="stat-card-modern slide-up">
                    <div class="stat-icon-wrap amber"><i class="bi bi-award"></i></div>
                    <div>
                        <div class="stat-value" id="certificateCount">0</div>
                        <div class="stat-label">Certificates</div>
                    </div>
                </div>
                <div class="stat-card-modern slide-up">
                    <div class="stat-icon-wrap cyan"><i class="bi bi-graph-up"></i></div>
                    <div>
                        <div class="stat-value" id="avgProgress">0%</div>
                        <div class="stat-label">Avg Progress</div>
                    </div>
                </div>
            </section>

            <!-- Courses + Activity -->
            <section class="layout">
                <div class="panel">
                    <h3><i class="bi bi-play-circle"></i> Continue Learning</h3>
                    <div id="continueCourses">
                        <!-- Skeleton loaders while data loads -->
                        <div class="skeleton-row">
                            <div class="skeleton" style="width:40px;height:40px;border-radius:10px"></div>
                            <div style="flex:1">
                                <div class="skeleton skeleton-text" style="width:70%"></div>
                                <div class="skeleton skeleton-text" style="width:40%"></div>
                            </div>
                        </div>
                        <div class="skeleton-row">
                            <div class="skeleton" style="width:40px;height:40px;border-radius:10px"></div>
                            <div style="flex:1">
                                <div class="skeleton skeleton-text" style="width:60%"></div>
                                <div class="skeleton skeleton-text" style="width:35%"></div>
                            </div>
                        </div>
                        <div class="skeleton-row">
                            <div class="skeleton" style="width:40px;height:40px;border-radius:10px"></div>
                            <div style="flex:1">
                                <div class="skeleton skeleton-text" style="width:55%"></div>
                                <div class="skeleton skeleton-text" style="width:45%"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="panel" style="animation-delay:.15s">
                    <h3><i class="bi bi-clock-history"></i> Recent Activity</h3>
                    <div id="recentActivity">
                        <div class="skeleton-row">
                            <div style="flex:1">
                                <div class="skeleton skeleton-text" style="width:50%"></div>
                                <div class="skeleton skeleton-text" style="width:80%"></div>
                            </div>
                            <div class="skeleton" style="width:60px;height:24px;border-radius:12px"></div>
                        </div>
                        <div class="skeleton-row">
                            <div style="flex:1">
                                <div class="skeleton skeleton-text" style="width:45%"></div>
                                <div class="skeleton skeleton-text" style="width:70%"></div>
                            </div>
                            <div class="skeleton" style="width:60px;height:24px;border-radius:12px"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const API_CANDIDATES = [5000, 5001, 5002, 5003, 5004, 5005].map(
            (port) => `http://${window.location.hostname || 'localhost'}:${port}/api`
        );
        let apiBase = null;

        async function getApiBase() {
            if (apiBase) return apiBase;
            for (const base of API_CANDIDATES) {
                try { const res = await fetch(`${base}/courses`); if (res.ok) { apiBase = base; return apiBase; } } catch (_) { }
            }
            throw new Error('Unable to connect to backend API.');
        }

        async function fetchFromApi(path, options) {
            const base = await getApiBase();
            const res = await fetch(`${base}${path}`, options);
            if (!res.ok) throw new Error(`Request failed: ${res.status}`);
            return await res.json();
        }

        function getToken() { return localStorage.getItem('token'); }

        function loadUserName() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && user.name) document.getElementById('userName').textContent = user.name.split(' ')[0];
        }

        async function trackLoginAttendance() {
            const token = getToken();
            if (!token) return;
            try {
                await fetchFromApi('/attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ activityType: 'login', details: 'Dashboard login' }),
                });
            } catch (_) { }
        }

        function renderCourses(courses) {
            const container = document.getElementById('continueCourses');
            if (!courses.length) {
                container.innerHTML = '<div class="empty-state"><i class="bi bi-journal-x"></i><p>No courses available yet</p></div>';
                return;
            }
            container.innerHTML = courses.slice(0, 4).map((course) => {
                const lessons = Number(course.lessons) || (course.modules?.length || 0);
                const progress = Math.min(100, Math.max(10, lessons * 4));
                return `
                    <article class="course" onclick="window.location.href='courses/course-player.html?id=${course._id}'">
                        <div><h4>${course.title}</h4><p>${course.instructor || 'Instructor'}</p></div>
                        <div class="meta"><span>${progress}% complete</span><span>${lessons} lessons</span></div>
                    </article>
                `;
            }).join('');
        }

        function renderRecent(assignments, tests, certificates) {
            const container = document.getElementById('recentActivity');
            const activities = [];
            assignments.slice(0, 2).forEach((a) => {
                const dueText = a.dueDate ? new Date(a.dueDate).toLocaleDateString() : 'No due date';
                activities.push({ title: 'Assignment', subtitle: `${a.title} • Due ${dueText}`, type: 'wait', label: 'Review' });
            });
            tests.slice(0, 1).forEach((t) => {
                const testText = t.startTime ? new Date(t.startTime).toLocaleDateString() : 'No schedule';
                activities.push({ title: 'Upcoming Test', subtitle: `${t.title} • ${testText}`, type: 'plan', label: 'Planned' });
            });
            certificates.filter((c) => c.status === 'earned').slice(0, 1).forEach((c) => {
                activities.push({ title: 'Certificate Earned', subtitle: c.title, type: 'ok', label: 'Done' });
            });
            if (!activities.length) {
                container.innerHTML = '<div class="empty-state" style="padding:var(--sp-8)"><i class="bi bi-clock-history"></i><p>No recent activity</p></div>';
                return;
            }
            container.innerHTML = activities.map((a) => `
                <div class="item">
                    <div><strong>${a.title}</strong><br><small>${a.subtitle}</small></div>
                    <span class="pill ${a.type}">${a.label}</span>
                </div>
            `).join('');
        }

        function updateStats(courses, tests, certificates) {
            const earned = certificates.filter((c) => c.status === 'earned').length;
            const progressValues = certificates.map((c) => {
                if (c.status === 'earned') return 100;
                if (typeof c.progressPercent === 'number') return c.progressPercent;
                if (c.status === 'inProgress') return 50;
                return 0;
            });
            const avg = progressValues.length ? Math.round(progressValues.reduce((s, v) => s + v, 0) / progressValues.length) : 0;
            document.getElementById('enrolledCount').textContent = courses.length;
            document.getElementById('completedCount').textContent = earned;
            document.getElementById('certificateCount').textContent = certificates.length;
            document.getElementById('avgProgress').textContent = `${avg}%`;
        }

        async function loadDashboardData() {
            try {
                const [coursesRes, assignmentsRes, testsRes, certificatesRes] = await Promise.all([
                    fetchFromApi('/courses'),
                    fetchFromApi('/assignments'),
                    fetchFromApi('/tests'),
                    fetchFromApi('/certificates'),
                ]);
                const courses = Array.isArray(coursesRes.courses) ? coursesRes.courses : [];
                const assignments = Array.isArray(assignmentsRes.assignments) ? assignmentsRes.assignments : [];
                const tests = Array.isArray(testsRes.tests) ? testsRes.tests : [];
                const certificates = Array.isArray(certificatesRes.certificates) ? certificatesRes.certificates : [];
                updateStats(courses, tests, certificates);
                renderCourses(courses);
                renderRecent(assignments, tests, certificates);
            } catch (error) { console.error('Dashboard data load failed:', error.message); }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUserName();
            loadDashboardData();
            trackLoginAttendance();
        });
    </script>
</body>

</html>
