<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates - CRISMATECH</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .certificates-hero {
            background: linear-gradient(135deg, var(--primary-color), #0040a3);
            color: white;
            padding: 60px var(--spacing-xl);
            margin-bottom: var(--spacing-2xl);
        }

        .certificates-hero h1 {
            margin: 0 0 var(--spacing-sm) 0;
            font-size: 36px;
            font-weight: 700;
        }

        .certificates-hero p {
            margin: 0;
            opacity: 0.9;
            font-size: 16px;
        }

        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-2xl);
            margin-bottom: var(--spacing-2xl);
        }

        .cert-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            transition: all var(--transition-duration) ease;
            display: flex;
            flex-direction: column;
        }

        .cert-card:hover {
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-4px);
        }

        .cert-banner {
            aspect-ratio: 16 / 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            position: relative;
            background: linear-gradient(135deg, var(--primary-color), #0040a3);
            color: white;
            overflow: hidden;
        }

        .cert-ribbon {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            color: white;
        }

        .cert-body {
            padding: var(--spacing-lg);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .cert-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: var(--spacing-xs);
        }

        .cert-course {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: var(--spacing-md);
        }

        .cert-meta {
            font-size: 12px;
            color: var(--text-light);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: var(--spacing-lg);
        }

        .cert-button {
            padding: var(--spacing-md);
            border: none;
            border-radius: var(--border-radius);
            background: var(--primary-color);
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background var(--transition-duration) ease;
        }

        .cert-button:hover {
            background: #003fa3;
        }

        .cert-button.secondary {
            background: white;
            color: var(--primary-color);
            border: 1px solid var(--primary-light);
        }

        .cert-button.secondary:hover {
            background: var(--primary-light);
        }

        .cert-locked {
            opacity: 0.7;
        }

        .cert-locked .cert-button {
            background: #CCCCCC;
            cursor: not-allowed;
        }

        .cert-locked .cert-button:hover {
            background: #CCCCCC;
        }

        @media (max-width: 768px) {
            .certificates-hero h1 {
                font-size: 28px;
            }

            .cert-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <span>CRISMATECH</span>
            </div>
            <ul class="navbar-menu">
                <li><a href="../dashboard.html">Dashboard</a></li>
                <li><a href="../courses/courses.html">Courses</a></li>
                <li><a href="../assignments/assignments.html">Assignments</a></li>
                <li><a href="../tests/test.html">Tests</a></li>
                <li><a href="certificate.html" style="color: var(--primary-color); font-weight: 700;">Certificates</a></li>
            </ul>
            <div class="navbar-auth">
                <a href="../profile/profile.html" style="color: var(--text-dark); font-weight: 500;">Profile</a>
                <button class="btn-outline" onclick="logout()" style="padding: var(--spacing-sm) var(--spacing-lg);">Logout</button>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <div class="certificates-hero">
        <h1>Your Certificates</h1>
        <p>Showcase your achievements and completed courses</p>
    </div>

    <!-- MAIN CONTENT -->
    <div class="dashboard-container">
        <!-- CERTIFICATES GRID -->
        <div class="cert-grid" id="certificatesGrid">
            <!-- Certificates will be inserted here -->
        </div>
    </div>

    <script>
        const certificates = [
            {
                id: 1,
                title: "Python Programming",
                course: "Python Programming",
                icon: "PYTHON",
                earnedDate: "Mar 1, 2026",
                status: "earned"
            },
            {
                id: 2,
                title: "Web Development",
                course: "Web Development Masterclass",
                icon: "WEB",
                earnedDate: "Feb 15, 2026",
                status: "earned"
            },
            {
                id: 3,
                title: "IoT Fundamentals",
                course: "IoT Fundamentals",
                icon: "IOT",
                completionRequirement: "80% progress",
                progressPercent: 45,
                status: "pending"
            },
            {
                id: 4,
                title: "Machine Learning",
                course: "Machine Learning Basics",
                icon: "ML",
                earnedDate: "Expected Mar 15, 2026",
                completionRequirement: "90% progress",
                progressPercent: 65,
                status: "inProgress"
            },
            {
                id: 5,
                title: "Cybersecurity",
                course: "Cybersecurity Essentials",
                icon: "LOCK",
                completionRequirement: "All tests passed",
                status: "locked"
            },
            {
                id: 6,
                title: "Cloud Computing",
                course: "Cloud Computing",
                icon: "CLOUD",
                completionRequirement: "Final assignment",
                status: "locked"
            }
        ];

        function renderCertificates() {
            const grid = document.getElementById('certificatesGrid');
            grid.innerHTML = certificates.map(cert => {
                let statusClass = cert.status === 'locked' ? 'cert-locked' : '';
                let buttonContent = '';
                let ribbonContent = '';

                if (cert.status === 'earned') {
                    buttonContent = `<button class="cert-button">View Certificate</button>`;
                    ribbonContent = `<div class="cert-ribbon">Earned</div>`;
                } else if (cert.status === 'inProgress') {
                    buttonContent = `
                        <div style="margin-bottom: var(--spacing-md);">
                            <div style="display: flex; justify-content: space-between; margin-bottom: var(--spacing-xs);">
                                <span style="font-size: 12px; color: var(--text-light);">Progress</span>
                                <span style="font-size: 12px; font-weight: 600; color: var(--primary-color);">${cert.progressPercent}%</span>
                            </div>
                            <div style="width: 100%; height: 6px; background: #f0f0f0; border-radius: 3px; overflow: hidden;">
                                <div style="height: 100%; background: var(--primary-color); width: ${cert.progressPercent}%;"></div>
                            </div>
                        </div>
                        <button class="cert-button secondary">Continue Learning</button>
                    `;
                    ribbonContent = `<div class="cert-ribbon">In Progress</div>`;
                } else if (cert.status === 'pending') {
                    buttonContent = `
                        <div style="margin-bottom: var(--spacing-md);">
                            <div style="display: flex; justify-content: space-between; margin-bottom: var(--spacing-xs);">
                                <span style="font-size: 12px; color: var(--text-light);">Progress</span>
                                <span style="font-size: 12px; font-weight: 600; color: var(--primary-color);">${cert.progressPercent}%</span>
                            </div>
                            <div style="width: 100%; height: 6px; background: #f0f0f0; border-radius: 3px; overflow: hidden;">
                                <div style="height: 100%; background: var(--primary-color); width: ${cert.progressPercent}%;"></div>
                            </div>
                        </div>
                        <button class="cert-button secondary">Continue Learning</button>
                    `;
                    ribbonContent = `<div class="cert-ribbon">In Progress</div>`;
                } else if (cert.status === 'locked') {
                    buttonContent = `<button class="cert-button" disabled>Locked</button>`;
                }

                return `
                    <div class="cert-card ${statusClass}">
                        <div class="cert-banner">
                            ${cert.icon}
                            ${ribbonContent}
                        </div>
                        <div class="cert-body">
                            <h3 class="cert-title">${cert.title}</h3>
                            <p class="cert-course">${cert.course}</p>
                            <div class="cert-meta">
                                ${cert.earnedDate ? `Earned: ${cert.earnedDate}` : `Requirement: ${cert.completionRequirement}`}
                            </div>
                            ${buttonContent}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '../login.html';
            }
        }

        // Initial render
        renderCertificates();
    </script>
</body>
</html>
