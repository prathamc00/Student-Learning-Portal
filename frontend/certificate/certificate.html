<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates | CRISMATECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        :root {
            --navy-900: #0d1b36;
            --navy-800: #13264a;
            --surface: #ffffff;
            --bg: #f3f6fb;
            --text: #1f2b46;
            --muted: #6f7f9f;
            --line: #e6ecf5;
            --blue: #2f6bff;
            --green: #1da772;
            --amber: #c07a0b;
            --shadow: 0 12px 30px rgba(17, 40, 89, 0.08);
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

        .shell { min-height: 100vh; display: grid; grid-template-columns: 250px 1fr; }
        .sidebar {
            background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
            color: #dce6ff;
            padding: 22px 14px;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .brand { padding: 10px 12px 22px; border-bottom: 1px solid rgba(255, 255, 255, 0.12); margin-bottom: 14px; }
        .brand h1 { font-size: 1.05rem; color: #fff; }
        .brand p { color: #9fb1d8; font-size: 0.78rem; margin-top: 6px; }
        .nav a {
            display: flex; align-items: center; gap: 10px;
            color: #cad7f7; text-decoration: none; padding: 11px 12px;
            border-radius: 10px; margin-bottom: 4px; font-weight: 500; font-size: 0.92rem;
            transition: 0.2s ease;
        }
        .nav a:hover, .nav a.active { background: rgba(255,255,255,0.14); color: #fff; }

        .main { padding: 24px; }
        .head {
            background: linear-gradient(135deg, #2f6bff 0%, #36a5ff 100%);
            color: #fff;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }
        .head h2 { font-size: 1.35rem; }
        .head p { margin-top: 6px; opacity: 0.95; font-size: 0.9rem; }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 12px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .banner {
            background: linear-gradient(135deg, #2f6bff 0%, #35a2ff 100%);
            color: #fff;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            position: relative;
        }

        .pill {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            padding: 4px 9px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .title { font-size: 0.95rem; font-weight: 700; }
        .sub { color: var(--muted); font-size: 0.82rem; }

        .progress {
            background: #edf2ff;
            border-radius: 10px;
            padding: 10px;
            font-size: 0.8rem;
            color: #365088;
        }
        .bar { margin-top: 7px; background: #d8e3fb; border-radius: 999px; height: 7px; overflow: hidden; }
        .bar span { display: block; height: 100%; background: var(--blue); }

        .btn {
            margin-top: 2px;
            border: 0;
            border-radius: 9px;
            padding: 9px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 0.82rem;
            background: var(--blue);
            color: #fff;
        }
        .btn.alt { background: #eaf0ff; color: #244792; }
        .locked { opacity: 0.72; }

        @media (max-width: 820px) {
            .shell { grid-template-columns: 1fr; }
            .sidebar { position: static; height: auto; }
            .main { padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="brand">
                <h1><i class="bi bi-mortarboard-fill"></i> CRISMATECH</h1>
                <p>Student Learning Portal</p>
            </div>
            <nav class="nav">
                <a href="../index.html"><i class="bi bi-house-door"></i> Home</a>
                <a href="../dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
                <a href="../courses/courses.html"><i class="bi bi-journal-bookmark"></i> Courses</a>
                <a href="../assignments/assignments.html"><i class="bi bi-file-earmark-check"></i> Assignments</a>
                <a href="../tests/test.html"><i class="bi bi-ui-checks-grid"></i> Tests</a>
                <a class="active" href="certificate.html"><i class="bi bi-award"></i> Certificates</a>
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </nav>
        </aside>

        <main class="main">
            <section class="head">
                <h2>Certificates and Achievements</h2>
                <p>View earned credentials, progress status, and what to complete next.</p>
            </section>

            <section class="cards" id="certGrid"></section>
        </main>
    </div>

    <script>
        const API_CANDIDATES = [5000, 5001, 5002, 5003, 5004, 5005].map(
            (port) => `http://${window.location.hostname || 'localhost'}:${port}/api`
        );

        let certificates = [];

        async function fetchFromApi(path) {
            for (const base of API_CANDIDATES) {
                try {
                    const res = await fetch(`${base}${path}`);
                    if (!res.ok) continue;
                    return await res.json();
                } catch (_) {
                    // Try next candidate.
                }
            }
            throw new Error('Unable to connect to backend API (ports 5000-5005).');
        }

        function getIconLabel(title = '') {
            const words = title.split(' ').filter(Boolean);
            return (words[0] || 'CR').slice(0, 3).toUpperCase();
        }

        function buildCard(c) {
            const ribbon = c.status === 'earned' ? 'Earned' : (c.status === 'locked' ? 'Locked' : 'In Progress');
            let content = '';
            if (c.status === 'earned') {
                const earned = c.earnedDate ? new Date(c.earnedDate).toLocaleDateString() : 'N/A';
                content = `<div class="sub">Earned: ${earned}</div><button class="btn">View Certificate</button>`;
            } else if (c.status === 'locked') {
                content = `<div class="sub">Requirement: ${c.completionRequirement || 'Course requirements not completed'}</div><button class="btn alt" disabled>Locked</button>`;
            } else {
                content = `
                    <div class="progress">
                        ${c.completionRequirement || 'Complete the course requirements'}
                        <div class="bar"><span style="width:${c.progressPercent || 0}%"></span></div>
                    </div>
                    <button class="btn alt">Continue Learning</button>
                `;
            }

            return `
                <article class="card ${c.status === 'locked' ? 'locked' : ''}">
                    <div class="banner">${getIconLabel(c.title)}<span class="pill">${ribbon}</span></div>
                    <div class="body">
                        <div class="title">${c.title}</div>
                        <div class="sub">${c.course}</div>
                        ${content}
                    </div>
                </article>
            `;
        }

        async function initCertificates() {
            try {
                const data = await fetchFromApi('/certificates');
                certificates = Array.isArray(data.certificates) ? data.certificates : [];
                document.getElementById('certGrid').innerHTML = certificates.map(buildCard).join('');
            } catch (error) {
                document.getElementById('certGrid').innerHTML = `
                    <article class="card" style="grid-column:1/-1;">
                        <div class="body">
                            <div class="title">Could not load certificates</div>
                            <div class="sub">${error.message}</div>
                        </div>
                    </article>
                `;
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        }

        document.addEventListener('DOMContentLoaded', initCertificates);
    </script>
</body>
</html>
