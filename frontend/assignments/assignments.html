<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - CRISMATECH</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--c-bg);
            min-height: 100vh;
        }

        .topbar {
            background: #fff;
            border-bottom: 1px solid #e6ecf5;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h1 {
            font-size: 1.3rem;
            color: #0d1b36;
        }

        .topbar a {
            color: #4F46E5;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .container {
            max-width: 900px;
            margin: 24px auto;
            padding: 0 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .card-header:hover {
            background: #f8faff;
        }

        .card-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .card-header-info {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .type-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .type-case_study {
            background: #ede9fe;
            color: #6d28d9;
        }

        .type-file_upload {
            background: #dbeafe;
            color: #1e40af;
        }

        .type-code {
            background: #fef3c7;
            color: #92400e;
        }

        .due-text {
            font-size: 12px;
            color: #64748b;
        }

        .card-body {
            padding: 0 20px 20px;
            display: none;
        }

        .card-body.open {
            display: block;
        }

        .instructions {
            background: #f8fafc;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #475569;
            line-height: 1.6;
        }

        .submit-section {
            margin-top: 12px;
        }

        .submit-section textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }

        .submit-section textarea:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .code-editor {
            width: 100%;
            min-height: 160px;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            background: #1e293b;
            color: #e2e8f0;
            resize: vertical;
        }

        .code-editor:focus {
            outline: none;
            border-color: #4F46E5;
        }

        .file-drop {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            margin-bottom: 12px;
        }

        .file-drop:hover {
            border-color: #4F46E5;
            background: #EEF2FF;
        }

        .file-drop i {
            font-size: 28px;
            color: #4F46E5;
        }

        .file-drop p {
            font-size: 13px;
            color: #64748b;
            margin-top: 6px;
        }

        .btn-submit {
            background: #4F46E5;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 14px;
            margin-top: 12px;
        }

        .btn-submit:hover {
            background: #4338CA;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .submission-status {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 12px;
            display: none;
        }

        .submission-status.submitted {
            display: block;
            background: #d1fae5;
            color: #065f46;
        }

        .submission-status.graded {
            display: block;
            background: #dbeafe;
            color: #1e40af;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <h1><i class="bi bi-file-earmark-check"></i> Assignments</h1>
        <a href="../dashboard.html">← Back to Dashboard</a>
    </div>
    <div class="container" id="assignmentsContainer">
        <div class="empty-state"><i class="bi bi-hourglass-split"></i>
            <p>Loading assignments...</p>
        </div>
    </div>

    <script>
        const API_CANDIDATES = [5000, 5001, 5002, 5003, 5004, 5005].map(p => `http://${window.location.hostname || 'localhost'}:${p}/api`);
        let apiBase = null;
        async function getApiBase() {
            if (apiBase) return apiBase;
            for (const b of API_CANDIDATES) { try { const r = await fetch(`${b}/courses`); if (r.ok) { apiBase = b; return b; } } catch (_) { } }
            throw new Error('Unable to connect to backend API.');
        }
        function getToken() { return localStorage.getItem('token'); }

        let assignments = [];
        let mySubmissions = {};

        async function loadData() {
            const base = await getApiBase();
            const token = getToken();

            const [aRes, sRes] = await Promise.all([
                fetch(`${base}/assignments`).then(r => r.json()),
                token ? fetch(`${base}/assignments/my-submissions`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json()) : Promise.resolve({ submissions: [] })
            ]);

            assignments = Array.isArray(aRes.assignments) ? aRes.assignments : [];
            (sRes.submissions || []).forEach(s => { mySubmissions[s.assignment?._id || s.assignment] = s; });

            renderAssignments();
        }

        function renderAssignments() {
            const container = document.getElementById('assignmentsContainer');
            if (!assignments.length) {
                container.innerHTML = '<div class="empty-state"><i class="bi bi-clipboard-x"></i><p>No assignments available yet.</p></div>';
                return;
            }
            container.innerHTML = assignments.map((a, i) => {
                const due = a.dueDate ? new Date(a.dueDate).toLocaleDateString() : 'No due date';
                const courseName = a.course?.title || a.course || 'General';
                const sub = mySubmissions[a._id];
                const isSubmitted = !!sub;
                const isGraded = sub && sub.grade !== undefined && sub.grade !== null;

                let submitUI = '';
                if (isGraded) {
                    submitUI = `<div class="submission-status graded"><i class="bi bi-check-circle"></i> Graded: ${sub.grade}/${a.maxMarks || 100}${sub.feedback ? ' — ' + sub.feedback : ''}</div>`;
                } else if (isSubmitted) {
                    submitUI = `<div class="submission-status submitted"><i class="bi bi-check-circle"></i> Submitted on ${new Date(sub.submittedAt).toLocaleDateString()}</div>`;
                } else if (a.type === 'case_study') {
                    submitUI = `
                        <div class="submit-section">
                            <textarea id="text-${i}" placeholder="Write your case study response here..."></textarea>
                            <button class="btn-submit" onclick="submitText('${a._id}', ${i})">Submit Response</button>
                        </div>`;
                } else if (a.type === 'code') {
                    submitUI = `
                        <div class="submit-section">
                            <textarea class="code-editor" id="code-${i}" placeholder="// Write your code here..."></textarea>
                            <button class="btn-submit" onclick="submitCode('${a._id}', ${i})">Submit Code</button>
                        </div>`;
                } else {
                    submitUI = `
                        <div class="submit-section">
                            <div class="file-drop" onclick="document.getElementById('file-${i}').click()">
                                <i class="bi bi-cloud-arrow-up"></i>
                                <p>Click to upload or drag your file here</p>
                            </div>
                            <input type="file" id="file-${i}" style="display:none" accept=".pdf,.doc,.docx,.zip,.txt" onchange="handleFileSelect(this, ${i})">
                            <span id="filename-${i}" style="font-size:12px;color:#475569;"></span>
                            <button class="btn-submit" id="submitBtn-${i}" onclick="submitFile('${a._id}', ${i})" disabled>Upload & Submit</button>
                        </div>`;
                }

                return `
                    <div class="card">
                        <div class="card-header" onclick="this.nextElementSibling.classList.toggle('open')">
                            <div>
                                <h3>${a.title}</h3>
                                <span class="due-text">${courseName} · Due: ${due}</span>
                            </div>
                            <div class="card-header-info">
                                <span class="type-badge type-${a.type}">${(a.type || '').replace('_', ' ')}</span>
                                <span class="due-text">${a.maxMarks || 100} marks</span>
                            </div>
                        </div>
                        <div class="card-body">
                            ${a.instructions ? `<div class="instructions"><strong>Instructions:</strong><br>${a.instructions}</div>` : ''}
                            ${submitUI}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleFileSelect(input, idx) {
            if (input.files.length) {
                document.getElementById(`filename-${idx}`).textContent = input.files[0].name;
                document.getElementById(`submitBtn-${idx}`).disabled = false;
            }
        }

        async function submitText(assignmentId, idx) {
            const text = document.getElementById(`text-${idx}`).value.trim();
            if (!text) { alert('Please write your response'); return; }
            await doSubmit(assignmentId, { textContent: text });
        }

        async function submitCode(assignmentId, idx) {
            const code = document.getElementById(`code-${idx}`).value.trim();
            if (!code) { alert('Please write your code'); return; }
            await doSubmit(assignmentId, { codeContent: code });
        }

        async function submitFile(assignmentId, idx) {
            const fileInput = document.getElementById(`file-${idx}`);
            if (!fileInput.files.length) { alert('Please select a file'); return; }
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            const base = await getApiBase();
            try {
                const res = await fetch(`${base}/assignments/${assignmentId}/submit`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` },
                    body: formData,
                });
                const data = await res.json();
                if (data.success) { alert('Submitted!'); loadData(); }
                else { alert(data.message || 'Submission failed'); }
            } catch (e) { alert('Server error'); }
        }

        async function doSubmit(assignmentId, body) {
            const base = await getApiBase();
            try {
                const res = await fetch(`${base}/assignments/${assignmentId}/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                    body: JSON.stringify(body),
                });
                const data = await res.json();
                if (data.success) { alert('Submitted successfully!'); loadData(); }
                else { alert(data.message || 'Submission failed'); }
            } catch (e) { alert('Server error'); }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>

</html>
