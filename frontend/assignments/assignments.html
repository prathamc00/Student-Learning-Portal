<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - CRISMATECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .assignments-hero {
            background: linear-gradient(135deg, var(--primary-color), #0040a3);
            color: white;
            padding: 60px var(--spacing-xl);
            margin-bottom: var(--spacing-2xl);
        }

        .assignments-hero h1 {
            margin: 0 0 var(--spacing-sm) 0;
            font-size: 36px;
            font-weight: 700;
        }

        .assignments-hero p {
            margin: 0;
            opacity: 0.9;
            font-size: 16px;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-2xl);
        }

        .stat-box {
            background: white;
            padding: var(--spacing-lg);
            border-radius: var(--border-radius);
            text-align: center;
            box-shadow: var(--card-shadow);
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: var(--spacing-sm);
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: var(--spacing-xs);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-light);
        }

        .filter-tabs {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-2xl);
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: var(--spacing-sm) var(--spacing-lg);
            border: 1px solid var(--border-color);
            background: white;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all var(--transition-duration) ease;
        }

        .filter-tab:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .filter-tab.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .assignments-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-2xl);
        }

        .assignment-item {
            background: white;
            padding: var(--spacing-lg);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all var(--transition-duration) ease;
        }

        .assignment-item:hover {
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-2px);
        }

        .assignment-info {
            flex: 1;
        }

        .assignment-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: var(--spacing-xs);
        }

        .assignment-course {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: var(--spacing-sm);
        }

        .assignment-due {
            font-size: 13px;
            color: var(--text-light);
        }

        .assignment-due.urgent {
            color: #EF4444;
            font-weight: 600;
        }

        .assignment-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-right: var(--spacing-lg);
        }

        .status-pending {
            background: #FFF3E0;
            color: #E65100;
        }

        .status-submitted {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .status-overdue {
            background: #FFEBEE;
            color: #C62828;
        }

        .assignment-grade {
            font-size: 13px;
            font-weight: 600;
            color: #2E7D32;
            margin-right: var(--spacing-lg);
        }

        .assignment-actions {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
        }

        .btn {
            padding: var(--spacing-sm) var(--spacing-lg);
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-duration) ease;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #003fa3;
        }

        .btn-secondary {
            background: white;
            color: var(--text-dark);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #f8f9fc;
        }

        @media (max-width: 768px) {
            .stats-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .assignment-item {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--spacing-lg);
            }

            .assignment-actions {
                width: 100%;
                justify-content: flex-start;
            }

            .assignments-hero h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <span>CRISMATECH</span>
            </div>
            <ul class="navbar-menu">
                <li><a href="../dashboard.html">Dashboard</a></li>
                <li><a href="../courses/courses.html">Courses</a></li>
                <li><a href="assignments.html" style="color: var(--primary-color); font-weight: 700;">Assignments</a></li>
                <li><a href="../tests/test.html">Tests</a></li>
                <li><a href="../certificate/certificate.html">Certificates</a></li>
            </ul>
            <div class="navbar-auth">
                <a href="../profile/profile.html" style="color: var(--text-dark); font-weight: 500;">Profile</a>
                <button class="btn-outline" onclick="logout()" style="padding: var(--spacing-sm) var(--spacing-lg);">Logout</button>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <div class="assignments-hero">
        <h1>Assignments</h1>
        <p>Submit your work and track your assignment progress</p>
    </div>

    <!-- MAIN CONTENT -->
    <div class="dashboard-container">
        <!-- STATS -->
        <div class="stats-cards">
            <div class="stat-box">
                <div class="stat-icon">📋</div>
                <div class="stat-number">8</div>
                <div class="stat-label">Total Assignments</div>
            </div>
            <div class="stat-box">
                <div class="stat-icon">⏳</div>
                <div class="stat-number">3</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-box">
                <div class="stat-icon">DONE</div>
                <div class="stat-number">4</div>
                <div class="stat-label">Submitted</div>
            </div>
            <div class="stat-box">
                <div class="stat-icon">WARNING</div>
                <div class="stat-number">1</div>
                <div class="stat-label">Overdue</div>
            </div>
        </div>

        <!-- FILTER TABS -->
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterAssignments('all')">All</button>
            <button class="filter-tab" onclick="filterAssignments('pending')">Pending</button>
            <button class="filter-tab" onclick="filterAssignments('submitted')">Submitted</button>
            <button class="filter-tab" onclick="filterAssignments('overdue')">Overdue</button>
        </div>

        <!-- ASSIGNMENTS LIST -->
        <div class="assignments-list" id="assignmentsList">
            <!-- Assignments will be inserted here -->
        </div>
    </div>

    <script>
        const assignments = [
            {
                id: 1,
                title: "Assignment #1 - HTML Basics Layout",
                course: "Web Development",
                due: "28 Feb 2026",
                status: "overdue",
                daysOverdue: 5
            },
            {
                id: 2,
                title: "Assignment #4 - CSS Flexbox Challenge",
                course: "Web Development",
                due: "6 Mar 2026",
                status: "pending",
                daysUntilDue: 1
            },
            {
                id: 3,
                title: "Assignment #5 - IoT Sensor Report",
                course: "IoT Fundamentals",
                due: "10 Mar 2026",
                status: "pending",
                daysUntilDue: 5
            },
            {
                id: 4,
                title: "Assignment #6 - ML Data Analysis",
                course: "Machine Learning",
                due: "15 Mar 2026",
                status: "pending",
                daysUntilDue: 10
            },
            {
                id: 5,
                title: "Assignment #2 - JavaScript Functions",
                course: "Web Development",
                submittedDate: "20 Feb 2026",
                status: "submitted",
                grade: 88
            },
            {
                id: 6,
                title: "Assignment #3 - Python OOP Task",
                course: "Python Programming",
                submittedDate: "25 Feb 2026",
                status: "submitted",
                grade: 92
            },
            {
                id: 7,
                title: "Assignment #7 - IoT Network Design",
                course: "IoT Fundamentals",
                submittedDate: "1 Mar 2026",
                status: "submitted",
                grade: 85
            },
            {
                id: 8,
                title: "Assignment #8 - Web3 Smart Contracts",
                course: "Blockchain Basics",
                submittedDate: "3 Mar 2026",
                status: "submitted",
                grade: 90
            }
        ];

        let currentFilter = 'all';

        function renderAssignments(filtered) {
            const list = document.getElementById('assignmentsList');
            list.innerHTML = filtered.map(a => {
                let content = '';
                if (a.status === 'pending') {
                    const isUrgent = a.daysUntilDue === 1;
                    content = `
                        <div class="assignment-item">
                            <div class="assignment-info">
                                <div class="assignment-title">${a.title}</div>
                                <div class="assignment-course">${a.course}</div>
                                <div class="assignment-due${isUrgent ? ' urgent' : ''}">
                                    DUE: ${a.due}${isUrgent ? ' (Tomorrow)' : ''}
                                </div>
                            </div>
                            <div class="assignment-actions">
                                <span class="assignment-status status-pending">Pending</span>
                                <button class="btn btn-primary">Submit</button>
                            </div>
                        </div>
                    `;
                } else if (a.status === 'overdue') {
                    content = `
                        <div class="assignment-item">
                            <div class="assignment-info">
                                <div class="assignment-title">${a.title}</div>
                                <div class="assignment-course">${a.course}</div>
                                <div class="assignment-due urgent">
                                    OVERDUE: ${a.due} (${a.daysOverdue} days late)
                                </div>
                            </div>
                            <div class="assignment-actions">
                                <span class="assignment-status status-overdue">Overdue</span>
                                <button class="btn btn-primary">Submit Late</button>
                            </div>
                        </div>
                    `;
                } else if (a.status === 'submitted') {
                    content = `
                        <div class="assignment-item">
                            <div class="assignment-info">
                                <div class="assignment-title">${a.title}</div>
                                <div class="assignment-course">${a.course}</div>
                                <div class="assignment-due">
                                    SUBMITTED: ${a.submittedDate} · Grade: <strong style="color: var(--primary-color);">${a.grade}/100</strong>
                                </div>
                            </div>
                            <div class="assignment-actions">
                                <span class="assignment-status status-submitted">Submitted</span>
                                <button class="btn btn-secondary">View Feedback</button>
                            </div>
                        </div>
                    `;
                }
                return content;
            }).join('');
        }

        function filterAssignments(filter) {
            currentFilter = filter;
            
            // Update active button
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Filter assignments
            let filtered = assignments;
            if (filter !== 'all') {
                filtered = assignments.filter(a => a.status === filter);
            }

            renderAssignments(filtered);
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '../login.html';
            }
        }

        // Initial render
        renderAssignments(assignments);
    </script>
</body>
</html>
