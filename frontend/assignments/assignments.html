<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments | CRISMATECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        :root {
            --navy-900: #0d1b36;
            --navy-800: #13264a;
            --surface: #ffffff;
            --bg: #f3f6fb;
            --text: #1f2b46;
            --muted: #6f7f9f;
            --line: #e6ecf5;
            --blue: #2f6bff;
            --blue-600: #1f57df;
            --green: #1da772;
            --amber: #c07a0b;
            --red: #c53b4a;
            --shadow: 0 12px 30px rgba(17, 40, 89, 0.08);
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

        .shell { min-height: 100vh; display: grid; grid-template-columns: 250px 1fr; }
        .sidebar {
            background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
            color: #dce6ff;
            padding: 22px 14px;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .brand {
            padding: 10px 12px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 14px;
        }
        .brand h1 { font-size: 1.05rem; color: #fff; letter-spacing: 0.5px; }
        .brand p { color: #9fb1d8; font-size: 0.78rem; margin-top: 6px; }
        .nav a {
            display: flex; align-items: center; gap: 10px;
            color: #cad7f7; text-decoration: none; padding: 11px 12px;
            border-radius: 10px; margin-bottom: 4px; font-weight: 500; font-size: 0.92rem;
            transition: 0.2s ease;
        }
        .nav a:hover, .nav a.active { background: rgba(255,255,255,0.14); color: #fff; }

        .main { padding: 24px; }
        .head {
            background: linear-gradient(135deg, #2f6bff 0%, #36a5ff 100%);
            color: #fff;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }
        .head h2 { font-size: 1.35rem; }
        .head p { margin-top: 6px; opacity: 0.95; font-size: 0.9rem; }

        .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 14px; }
        .stat {
            background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
            padding: 14px; box-shadow: var(--shadow);
        }
        .stat small { color: var(--muted); }
        .stat strong { display: block; margin-top: 6px; font-size: 1.4rem; color: var(--blue); }

        .tabs {
            background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
            box-shadow: var(--shadow); padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
        }
        .tabs button {
            border: 1px solid var(--line); background: #f9fbff; color: #3b4d74;
            padding: 8px 12px; border-radius: 9px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 0.84rem;
        }
        .tabs button.active { background: #2f6bff; border-color: #2f6bff; color: #fff; }

        .list { display: flex; flex-direction: column; gap: 10px; }
        .card {
            background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
            padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
        }
        .title { font-size: 0.98rem; font-weight: 700; margin-bottom: 3px; }
        .meta { color: var(--muted); font-size: 0.82rem; }
        .actions { display: flex; align-items: center; gap: 8px; }
        .badge { padding: 5px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
        .pending { background: #ffeecf; color: var(--amber); }
        .submitted { background: #dbf6eb; color: var(--green); }
        .overdue { background: #ffe1e5; color: var(--red); }
        .btn {
            border: 0; border-radius: 9px; padding: 8px 10px; font-size: 0.8rem; cursor: pointer; font-weight: 600;
            background: var(--blue); color: #fff;
        }
        .btn.ghost { background: #edf2ff; color: #244792; }

        @media (max-width: 1020px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } }
        @media (max-width: 820px) {
            .shell { grid-template-columns: 1fr; }
            .sidebar { position: static; height: auto; }
            .main { padding: 14px; }
            .card { grid-template-columns: 1fr; }
            .actions { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="brand">
                <h1><i class="bi bi-mortarboard-fill"></i> CRISMATECH</h1>
                <p>Student Learning Portal</p>
            </div>
            <nav class="nav">
                <a href="../index.html"><i class="bi bi-house-door"></i> Home</a>
                <a href="../dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
                <a href="../courses/courses.html"><i class="bi bi-journal-bookmark"></i> Courses</a>
                <a class="active" href="assignments.html"><i class="bi bi-file-earmark-check"></i> Assignments</a>
                <a href="../tests/test.html"><i class="bi bi-ui-checks-grid"></i> Tests</a>
                <a href="../certificate/certificate.html"><i class="bi bi-award"></i> Certificates</a>
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </nav>
        </aside>

        <main class="main">
            <section class="head">
                <h2>Assignments Workspace</h2>
                <p>Track due dates, submissions, and grading status in one place.</p>
            </section>

            <section class="stats">
                <div class="stat"><small>Total</small><strong id="totalCount">00</strong></div>
                <div class="stat"><small>Pending</small><strong id="pendingCount">00</strong></div>
                <div class="stat"><small>Submitted</small><strong id="submittedCount">00</strong></div>
                <div class="stat"><small>Overdue</small><strong id="overdueCount">00</strong></div>
            </section>

            <section class="tabs">
                <button class="active" onclick="setFilter('all', this)">All</button>
                <button onclick="setFilter('pending', this)">Pending</button>
                <button onclick="setFilter('submitted', this)">Submitted</button>
                <button onclick="setFilter('overdue', this)">Overdue</button>
            </section>

            <section class="list" id="list"></section>
        </main>
    </div>

    <script>
        const API_CANDIDATES = [5000, 5001, 5002, 5003, 5004, 5005].map(
            (port) => `http://${window.location.hostname || 'localhost'}:${port}/api`
        );

        let assignments = [];

        async function fetchFromApi(path) {
            for (const base of API_CANDIDATES) {
                try {
                    const res = await fetch(`${base}${path}`);
                    if (!res.ok) continue;
                    return await res.json();
                } catch (_) {
                    // Try next candidate.
                }
            }
            throw new Error('Unable to connect to backend API (ports 5000-5005).');
        }

        function formatInfo(assignment) {
            if (assignment.status === 'submitted') {
                const submittedDate = assignment.updatedAt
                    ? new Date(assignment.updatedAt).toLocaleDateString()
                    : 'N/A';
                return `Submitted ${submittedDate} • Max ${assignment.maxMarks}`;
            }

            const dueDate = assignment.dueDate
                ? new Date(assignment.dueDate).toLocaleDateString()
                : 'N/A';
            return `Due ${dueDate} • Max ${assignment.maxMarks}`;
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = String(assignments.length).padStart(2, '0');
            document.getElementById('pendingCount').textContent = String(assignments.filter((a) => a.status === 'pending').length).padStart(2, '0');
            document.getElementById('submittedCount').textContent = String(assignments.filter((a) => a.status === 'submitted').length).padStart(2, '0');
            document.getElementById('overdueCount').textContent = String(assignments.filter((a) => a.status === 'overdue').length).padStart(2, '0');
        }

        function badgeClass(status) {
            if (status === 'submitted') return 'submitted';
            if (status === 'overdue') return 'overdue';
            return 'pending';
        }

        function render(filter = 'all') {
            const data = filter === 'all' ? assignments : assignments.filter((a) => a.status === filter);
            document.getElementById('list').innerHTML = data.map((a) => `
                <article class="card">
                    <div>
                        <div class="title">${a.title}</div>
                        <div class="meta">${a.course} • ${formatInfo(a)}</div>
                    </div>
                    <div class="actions">
                        <span class="badge ${badgeClass(a.status)}">${a.status}</span>
                        <button class="btn ${a.status === 'submitted' ? 'ghost' : ''}">${a.status === 'submitted' ? 'View Feedback' : (a.status === 'overdue' ? 'Submit Late' : 'Submit')}</button>
                    </div>
                </article>
            `).join('');
        }

        function setFilter(filter, button) {
            document.querySelectorAll('.tabs button').forEach((b) => b.classList.remove('active'));
            button.classList.add('active');
            render(filter);
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        }

        async function initAssignments() {
            try {
                const data = await fetchFromApi('/assignments');
                assignments = Array.isArray(data.assignments) ? data.assignments : [];
                updateStats();
                render();
            } catch (error) {
                document.getElementById('list').innerHTML = `
                    <article class="card" style="grid-column:1/-1;">
                        <div>
                            <div class="title">Could not load assignments</div>
                            <div class="meta">${error.message}</div>
                        </div>
                    </article>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', initAssignments);
    </script>
</body>
</html>
