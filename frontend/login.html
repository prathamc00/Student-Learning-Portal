<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Student Learning Portal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card .brand-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .login-card h2 {
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 6px;
        }

        .login-card .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-floating {
            margin-bottom: 16px;
        }

        .form-floating .form-control {
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            padding: 16px 14px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-floating .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .btn-login {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
            color: white;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #999;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            padding: 0 16px;
        }

        .login-card .links {
            text-align: center;
            margin-top: 12px;
        }

        .login-card .links a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }

        .login-card .links a:hover {
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: 24px;
            left: 24px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }

        .back-home:hover {
            color: white;
        }

        .remember-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember-row a {
            color: #4f46e5;
            text-decoration: none;
        }

        .remember-row a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-page">
        <a href="index.html" class="back-home">← Back to Home</a>

        <div class="login-card text-center">
            <div class="brand-icon">🎓</div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to continue your learning journey</p>

            <form id="loginForm">
                <div class="form-floating">
                    <input type="email" class="form-control" id="loginEmail" placeholder="Email" required>
                    <label for="loginEmail">Email Address</label>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
                    <label for="loginPassword">Password</label>
                </div>

                <div class="remember-row">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a href="password/forgot.html">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-login">Sign In</button>
            </form>

            <div class="divider"><span>or</span></div>

            <div class="links">
                Don't have an account? <a href="register.html">Create one now</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
