<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — CRISMATECH</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        body {
            background: var(--c-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--sp-5);
        }

        .bg-blobs {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .3;
            animation: float 8s ease-in-out infinite;
        }

        .blob-1 {
            width: 450px;
            height: 450px;
            background: #6C63FF;
            top: -10%;
            left: -5%;
            animation-duration: 10s;
        }

        .blob-2 {
            width: 350px;
            height: 350px;
            background: #7C3AED;
            bottom: -5%;
            right: -5%;
            animation-duration: 12s;
            animation-delay: -4s;
        }

        .reset-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--sp-2);
            font-weight: 600;
            font-size: var(--fs-sm);
            color: var(--c-primary);
            margin-bottom: var(--sp-6);
            background: var(--c-surface);
            padding: var(--sp-2) var(--sp-4);
            border-radius: var(--r-full);
            box-shadow: var(--shadow-sm);
            transition: all var(--t-fast);
        }

        .back-link:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .reset-card {
            background: var(--c-surface);
            border-radius: var(--r-xl);
            padding: var(--sp-10) var(--sp-8);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--c-border-light);
            animation: slideUp .5s var(--ease) both;
        }

        .reset-header {
            text-align: center;
            margin-bottom: var(--sp-8);
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            background: var(--c-primary-gradient);
            border-radius: var(--r-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--sp-4);
            font-size: 28px;
            color: #fff;
            box-shadow: 0 6px 20px var(--c-primary-glow);
        }

        .reset-header h1 {
            font-size: var(--fs-2xl);
            font-weight: 700;
            margin-bottom: var(--sp-2);
        }

        .reset-header p {
            color: var(--c-text-muted);
            font-size: var(--fs-base);
            line-height: 1.6;
        }

        .alert-box {
            padding: var(--sp-3) var(--sp-4);
            border-radius: var(--r-md);
            margin-bottom: var(--sp-5);
            font-size: var(--fs-sm);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            animation: slideUp .3s var(--ease) both;
        }

        .alert-box.success {
            background: var(--c-success-light);
            color: #065F46;
        }

        .alert-box.error {
            background: var(--c-danger-light);
            color: var(--c-danger);
        }

        /* Password strength */
        .pw-strength {
            height: 4px;
            border-radius: 2px;
            background: var(--c-border-light);
            margin-top: var(--sp-2);
            overflow: hidden;
        }

        .pw-strength-fill {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: all .3s ease;
        }

        .pw-strength-fill.weak {
            width: 33%;
            background: var(--c-danger);
        }

        .pw-strength-fill.medium {
            width: 66%;
            background: var(--c-warning);
        }

        .pw-strength-fill.strong {
            width: 100%;
            background: var(--c-success);
        }

        .reset-footer {
            text-align: center;
            margin-top: var(--sp-6);
            font-size: var(--fs-base);
            color: var(--c-text-secondary);
        }

        .reset-footer a {
            font-weight: 600;
            color: var(--c-primary);
        }

        /* Success state */
        .success-view {
            text-align: center;
            display: none;
        }

        .success-view .check-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--c-success-light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--sp-5);
            font-size: 32px;
            color: var(--c-success);
            animation: scaleIn .4s var(--ease-spring) both;
        }

        .success-view h2 {
            font-size: var(--fs-xl);
            font-weight: 700;
            margin-bottom: var(--sp-2);
        }

        .success-view p {
            color: var(--c-text-muted);
            font-size: var(--fs-base);
            line-height: 1.6;
            margin-bottom: var(--sp-6);
        }

        @media (max-width: 480px) {
            .reset-card {
                padding: var(--sp-8) var(--sp-5);
            }
        }
    </style>
</head>

<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="reset-container">
        <a href="../login.html" class="back-link"><i class="bi bi-arrow-left"></i> Back to Login</a>

        <div class="reset-card">
            <!-- Form View -->
            <div id="formView">
                <div class="reset-header">
                    <div class="icon-circle"><i class="bi bi-shield-lock"></i></div>
                    <h1>Reset Password</h1>
                    <p>Enter your new password below. Make sure it's strong and secure.</p>
                </div>

                <div id="alertContainer"></div>

                <form id="resetForm">
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-lock"></i>
                            <input type="password" class="form-input" id="newPassword"
                                placeholder="Enter new password" required minlength="6">
                        </div>
                        <div class="pw-strength">
                            <div class="pw-strength-fill" id="pwStrength"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-shield-lock"></i>
                            <input type="password" class="form-input" id="confirmPassword"
                                placeholder="Confirm your password" required minlength="6">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg" id="submitBtn">Reset Password</button>
                </form>

                <div class="reset-footer">
                    Remember your password? <a href="../login.html">Sign in</a>
                </div>
            </div>

            <!-- Success View -->
            <div id="successView" class="success-view">
                <div class="check-circle"><i class="bi bi-check-lg"></i></div>
                <h2>Password Reset!</h2>
                <p>Your password has been updated successfully. You can now sign in with your new password.</p>
                <a href="../login.html" class="btn btn-primary w-100 btn-lg"
                    style="display:inline-block;text-align:center;text-decoration:none;">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        const API_CANDIDATES = [5000, 5001, 5002, 5003, 5004, 5005].map(
            (port) => `http://${window.location.hostname || 'localhost'}:${port}/api`
        );
        let apiBase = null;

        async function getApiBase() {
            if (apiBase) return apiBase;
            for (const base of API_CANDIDATES) {
                try { const r = await fetch(`${base}/courses`); if (r.ok) { apiBase = base; return base; } } catch (_) { }
            }
            throw new Error('Unable to connect to backend API.');
        }

        // Password strength
        document.getElementById('newPassword').addEventListener('input', function () {
            const fill = document.getElementById('pwStrength');
            const val = this.value;
            fill.className = 'pw-strength-fill';
            let score = 0;
            if (val.length >= 8) score++;
            if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^a-zA-Z0-9]/.test(val)) score++;
            if (score <= 1 && val.length > 0) fill.classList.add('weak');
            else if (score <= 2) fill.classList.add('medium');
            else if (score >= 3) fill.classList.add('strong');
        });

        function getTokenFromURL() {
            return new URLSearchParams(window.location.search).get('token');
        }

        function showAlert(message, type) {
            document.getElementById('alertContainer').innerHTML = `
                <div class="alert-box ${type}">
                    <i class="bi bi-${type === 'success' ? 'check-circle-fill' : 'exclamation-circle-fill'}"></i>
                    ${message}
                </div>
            `;
        }

        async function validateResetLink() {
            const token = getTokenFromURL();
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;

            if (!token) {
                showAlert('Invalid reset link. Please request a new password reset from the login page.', 'error');
                return false;
            }

            try {
                const base = await getApiBase();
                const res = await fetch(`${base}/auth/reset-password/validate?token=${encodeURIComponent(token)}`);
                const data = await res.json();

                if (!res.ok || !data.success) {
                    showAlert(data.message || 'This reset link is invalid or has expired.', 'error');
                    return false;
                }

                document.getElementById('alertContainer').innerHTML = '';
                submitBtn.disabled = false;
                return true;
            } catch (error) {
                showAlert('Unable to verify reset link. Please try again later.', 'error');
                return false;
            }
        }

        validateResetLink();

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const token = getTokenFromURL();
            const btn = document.getElementById('submitBtn');

            if (!token) {
                showAlert('Invalid reset link. Please request a new one.', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showAlert('Password must be at least 6 characters long.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert('Passwords do not match.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';

            try {
                const base = await getApiBase();
                const res = await fetch(`${base}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword }),
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('formView').style.display = 'none';
                    document.getElementById('successView').style.display = 'block';
                } else {
                    showAlert(data.message || 'Failed to reset password', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Reset Password';
                }
            } catch (err) {
                showAlert('Server error. Please try again later.', 'error');
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>

</html>
