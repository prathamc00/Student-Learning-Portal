<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - CRISMATECH</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--c-bg);
            min-height: 100vh;
        }

        .topbar {
            background: #fff;
            border-bottom: 1px solid #e6ecf5;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h1 {
            font-size: 1.3rem;
        }

        .topbar a {
            color: var(--c-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .container {
            max-width: 900px;
            margin: 24px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: 16px;
            text-align: center;
        }

        .stat strong {
            display: block;
            font-size: 1.6rem;
            color: var(--c-primary);
        }

        .stat small {
            color: #64748b;
            font-size: 12px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            font-weight: 700;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #f8f9fc;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item-info h4 {
            font-size: 14px;
            font-weight: 600;
        }

        .list-item-info p {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-login {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-video {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-material {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-module {
            background: #ede9fe;
            color: #6d28d9;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        @media (max-width: 768px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="topbar">
        <h1><i class="bi bi-calendar-check"></i> My Attendance</h1>
        <a href="../dashboard.html">← Back to Dashboard</a>
    </div>
    <div class="container">
        <div class="stats">
            <div class="stat"><strong id="totalActivities">0</strong><small>Total Activities</small></div>
            <div class="stat"><strong id="loginCount">0</strong><small>Logins</small></div>
            <div class="stat"><strong id="videoCount">0</strong><small>Videos Watched</small></div>
            <div class="stat"><strong id="moduleCount">0</strong><small>Modules Completed</small></div>
        </div>
        <div class="card">
            <div class="card-header">Activity History</div>
            <div id="attendanceList">
                <div class="empty-state"><i class="bi bi-hourglass-split"></i>
                    <p>Loading...</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        const API_CANDIDATES = [5000, 5001, 5002, 5003, 5004, 5005].map(p => `http://${window.location.hostname || 'localhost'}:${p}/api`);
        let apiBase = null;
        async function getApiBase() {
            if (apiBase) return apiBase;
            for (const b of API_CANDIDATES) { try { const r = await fetch(`${b}/courses`); if (r.ok) { apiBase = b; return b; } } catch (_) { } }
            throw new Error('Unable to connect to backend API.');
        }
        function getToken() { return localStorage.getItem('token'); }

        const badgeMap = { login: 'badge-login', video_watch: 'badge-video', material_access: 'badge-material', module_complete: 'badge-module' };
        const labelMap = { login: 'Login', video_watch: 'Video Watch', material_access: 'Material Access', module_complete: 'Module Complete' };

        async function loadAttendance() {
            const base = await getApiBase();
            const token = getToken();
            if (!token) { window.location.href = '../login.html'; return; }
            try {
                const res = await fetch(`${base}/attendance/my`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (!data.success) { document.getElementById('attendanceList').innerHTML = '<div class="empty-state"><p>Failed to load.</p></div>'; return; }

                const records = data.records || [];
                document.getElementById('totalActivities').textContent = records.length;
                document.getElementById('loginCount').textContent = records.filter(r => r.activityType === 'login').length;
                document.getElementById('videoCount').textContent = records.filter(r => r.activityType === 'video_watch').length;
                document.getElementById('moduleCount').textContent = records.filter(r => r.activityType === 'module_complete').length;

                if (!records.length) {
                    document.getElementById('attendanceList').innerHTML = '<div class="empty-state"><i class="bi bi-calendar-x"></i><p>No activity recorded yet.</p></div>';
                    return;
                }
                document.getElementById('attendanceList').innerHTML = records.map(r => {
                    const date = new Date(r.createdAt).toLocaleString();
                    const courseName = r.course?.title || 'General';
                    return `
                        <div class="list-item">
                            <div class="list-item-info">
                                <h4>${r.details || labelMap[r.activityType] || r.activityType}</h4>
                                <p>${courseName} · ${date}</p>
                            </div>
                            <span class="badge ${badgeMap[r.activityType] || 'badge-login'}">${labelMap[r.activityType] || r.activityType}</span>
                        </div>
                    `;
                }).join('');
            } catch (e) { console.error(e); }
        }

        document.addEventListener('DOMContentLoaded', loadAttendance);
    </script>
</body>

</html>
