<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Registration - CRISMATECH</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: var(--font);
            background: radial-gradient(circle at 8% 16%, #ecfeff 0%, transparent 30%),
                radial-gradient(circle at 90% 10%, #dcfce7 0%, transparent 32%),
                linear-gradient(135deg, #f1f5f9 0%, #f8fafc 100%);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 680px;
            background: #fff;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 42px rgba(15, 23, 42, .1);
            padding: 28px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            color: #0f172a;
        }

        .sub {
            margin: 10px 0 22px;
            color: #475569;
            font-size: 14px;
            max-width: 560px;
        }

        .notice {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 14px;
            font-size: 13px;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .field {
            margin-bottom: 12px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 0 12px;
        }

        .input-wrap:focus-within {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, .15);
        }

        .input-wrap i {
            color: #64748b;
        }

        .input-wrap input,
        .input-wrap select {
            border: 0;
            outline: 0;
            width: 100%;
            background: transparent;
            padding: 12px 0;
            font-size: 14px;
            font-family: inherit;
        }

        .btn {
            margin-top: 8px;
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 13px;
            background: linear-gradient(135deg, #0f766e, #0369a1);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        .links {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
        }

        .links a {
            color: #0c4a6e;
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Instructor Registration</h1>
        <p class="sub">Create your instructor account. New instructor registrations are reviewed by admin before login is enabled.</p>

        <div class="notice"><i class="bi bi-shield-check"></i> Admin approval is required after signup.</div>

        <form id="instructorRegisterForm">
            <div class="grid">
                <div class="field">
                    <label for="fullName">Full name</label>
                    <div class="input-wrap">
                        <i class="bi bi-person"></i>
                        <input id="fullName" type="text" required>
                    </div>
                </div>

                <div class="field">
                    <label for="phone">Phone</label>
                    <div class="input-wrap">
                        <i class="bi bi-phone"></i>
                        <input id="phone" type="tel" required>
                    </div>
                </div>

                <div class="field full">
                    <label for="email">Email</label>
                    <div class="input-wrap">
                        <i class="bi bi-envelope"></i>
                        <input id="email" type="email" placeholder="faculty@college.edu" required>
                    </div>
                </div>

                <div class="field full">
                    <label for="collegeName">College</label>
                    <div class="input-wrap">
                        <i class="bi bi-building"></i>
                        <input id="collegeName" type="text" required>
                    </div>
                </div>

                <div class="field">
                    <label for="branch">Department</label>
                    <div class="input-wrap">
                        <i class="bi bi-bookmark"></i>
                        <input id="branch" type="text" required>
                    </div>
                </div>

                <div class="field">
                    <label for="semester">Semester (optional)</label>
                    <div class="input-wrap">
                        <i class="bi bi-calendar3"></i>
                        <select id="semester">
                            <option value="">Not applicable</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock"></i>
                        <input id="password" type="password" minlength="6" required>
                    </div>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="input-wrap">
                        <i class="bi bi-shield-lock"></i>
                        <input id="confirmPassword" type="password" minlength="6" required>
                    </div>
                </div>
            </div>

            <button class="btn" type="submit">Create Instructor Account</button>
        </form>

        <div class="links">
            <a href="instructor-login.html">Already approved? Sign in</a>
            <a href="../register.html">Student registration</a>
            <a href="../index.html">Back to home</a>
        </div>
    </div>

    <script>
        const API_CANDIDATES = [5000, 5001, 5002, 5003, 5004, 5005].map(
            (port) => `http://${window.location.hostname || 'localhost'}:${port}/api`
        );
        let apiBase = null;

        async function getApiBase() {
            if (apiBase) return apiBase;
            for (const base of API_CANDIDATES) {
                try {
                    const res = await fetch(`${base}/courses`);
                    if (res.ok) {
                        apiBase = base;
                        return apiBase;
                    }
                } catch (_) {
                    // Ignore and try next candidate.
                }
            }
            throw new Error('Unable to connect to backend API.');
        }

        document.getElementById('instructorRegisterForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (password !== confirmPassword) {
                alert('Passwords do not match.');
                return;
            }

            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            const body = {
                name: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                college: document.getElementById('collegeName').value.trim(),
                branch: document.getElementById('branch').value.trim(),
                semester: document.getElementById('semester').value || null,
                password,
            };

            try {
                const base = await getApiBase();
                const response = await fetch(`${base}/auth/instructor/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                const data = await response.json();
                if (!data.success) {
                    alert(data.message || 'Registration failed.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Instructor Account';
                    return;
                }

                window.location.href = 'instructor-login.html?status=registered';
            } catch (error) {
                alert('Server error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Instructor Account';
            }
        });
    </script>
</body>

</html>
