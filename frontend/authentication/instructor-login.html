<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Sign In - CRISMATECH</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: var(--font);
            background: radial-gradient(circle at 15% 20%, #d8f3dc 0%, transparent 34%),
                radial-gradient(circle at 82% 12%, #dbeafe 0%, transparent 36%),
                linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, .12);
            padding: 28px;
        }

        .badge {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 6px 12px;
            border-radius: 999px;
            background: #ecfccb;
            color: #3f6212;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: .4px;
            text-transform: uppercase;
        }

        h1 {
            margin: 14px 0 8px;
            font-size: 28px;
            color: #0f172a;
        }

        .sub {
            margin: 0 0 18px;
            color: #475569;
            font-size: 14px;
        }

        .status {
            display: none;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 600;
        }

        .status.show {
            display: block;
        }

        .status.info {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            color: #334155;
            font-weight: 600;
            font-size: 13px;
        }

        .input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 0 12px;
            background: #fff;
        }

        .input-wrap:focus-within {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
        }

        .input-wrap i {
            color: #64748b;
        }

        .input-wrap input {
            width: 100%;
            border: 0;
            outline: 0;
            padding: 12px 0;
            font-size: 14px;
            background: transparent;
        }

        .btn {
            width: 100%;
            margin-top: 6px;
            border: 0;
            border-radius: 12px;
            padding: 12px;
            background: linear-gradient(135deg, #059669, #0ea5e9);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        .links {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }

        .links a {
            color: #0369a1;
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="card">
        <span class="badge"><i class="bi bi-easel2-fill"></i> Instructor Access</span>
        <h1>Instructor Sign In</h1>
        <p class="sub">Sign in to manage your courses, assignments, and quizzes.</p>

        <div id="statusBanner" class="status"></div>

        <form id="loginForm" data-auth-mode="instructor">
            <div class="field">
                <label for="loginEmail">Email</label>
                <div class="input-wrap">
                    <i class="bi bi-envelope"></i>
                    <input id="loginEmail" type="email" placeholder="faculty@college.edu" required>
                </div>
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <div class="input-wrap">
                    <i class="bi bi-lock"></i>
                    <input id="loginPassword" type="password" placeholder="Enter password" required>
                </div>
            </div>

            <button class="btn" type="submit">Sign In as Instructor</button>
        </form>

        <div class="links">
            <a href="instructor-register.html">New instructor? Register here</a>
            <a href="../login.html">Student/Admin sign in</a>
            <a href="../password/forgot.html">Forgot password?</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const status = params.get('status');
        const banner = document.getElementById('statusBanner');

        if (status === 'registered') {
            banner.textContent = 'Registration submitted. Wait for admin approval before signing in.';
            banner.className = 'status show info';
        }
    </script>
    <script src="../js/script.js"></script>
</body>

</html>
