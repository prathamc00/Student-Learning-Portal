<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests | CRISMATECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        :root {
            --navy-900: #0d1b36;
            --navy-800: #13264a;
            --surface: #ffffff;
            --bg: #f3f6fb;
            --text: #1f2b46;
            --muted: #6f7f9f;
            --line: #e6ecf5;
            --blue: #2f6bff;
            --green: #1da772;
            --amber: #c07a0b;
            --shadow: 0 12px 30px rgba(17, 40, 89, 0.08);
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

        .shell { min-height: 100vh; display: grid; grid-template-columns: 250px 1fr; }
        .sidebar {
            background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
            color: #dce6ff;
            padding: 22px 14px;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .brand { padding: 10px 12px 22px; border-bottom: 1px solid rgba(255, 255, 255, 0.12); margin-bottom: 14px; }
        .brand h1 { font-size: 1.05rem; color: #fff; }
        .brand p { color: #9fb1d8; font-size: 0.78rem; margin-top: 6px; }
        .nav a {
            display: flex; align-items: center; gap: 10px;
            color: #cad7f7; text-decoration: none; padding: 11px 12px;
            border-radius: 10px; margin-bottom: 4px; font-weight: 500; font-size: 0.92rem;
            transition: 0.2s ease;
        }
        .nav a:hover, .nav a.active { background: rgba(255,255,255,0.14); color: #fff; }

        .main { padding: 24px; }
        .head {
            background: linear-gradient(135deg, #2f6bff 0%, #36a5ff 100%);
            color: #fff;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }
        .head h2 { font-size: 1.35rem; }
        .head p { margin-top: 6px; opacity: 0.95; font-size: 0.9rem; }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 11px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .title { font-size: 0.96rem; font-weight: 700; }
        .course { color: var(--muted); font-size: 0.8rem; margin-top: 3px; }

        .status {
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 700;
        }
        .upcoming { background: #ffeecf; color: var(--amber); }
        .completed { background: #dbf6eb; color: var(--green); }

        .meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .meta div {
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 8px;
            text-align: center;
            font-size: 0.8rem;
            color: #38507f;
            background: #fafcff;
        }
        .meta strong { display: block; font-size: 1.05rem; color: var(--blue); }

        .score {
            border-radius: 10px;
            background: #edf2ff;
            color: #27437b;
            padding: 10px;
            text-align: center;
            font-size: 0.8rem;
        }
        .score strong { font-size: 1.35rem; color: var(--blue); }

        .btn {
            margin-top: auto;
            border: 0;
            border-radius: 9px;
            padding: 9px;
            cursor: pointer;
            font-weight: 600;
            background: var(--blue);
            color: #fff;
            font-family: inherit;
            font-size: 0.82rem;
        }
        .btn.alt { background: #eaf0ff; color: #244792; }

        @media (max-width: 820px) {
            .shell { grid-template-columns: 1fr; }
            .sidebar { position: static; height: auto; }
            .main { padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="brand">
                <h1><i class="bi bi-mortarboard-fill"></i> CRISMATECH</h1>
                <p>Student Learning Portal</p>
            </div>
            <nav class="nav">
                <a href="../index.html"><i class="bi bi-house-door"></i> Home</a>
                <a href="../dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
                <a href="../courses/courses.html"><i class="bi bi-journal-bookmark"></i> Courses</a>
                <a href="../assignments/assignments.html"><i class="bi bi-file-earmark-check"></i> Assignments</a>
                <a class="active" href="test.html"><i class="bi bi-ui-checks-grid"></i> Tests</a>
                <a href="../certificate/certificate.html"><i class="bi bi-award"></i> Certificates</a>
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </nav>
        </aside>

        <main class="main">
            <section class="head">
                <h2>Tests and Assessments</h2>
                <p>Check schedules, attempt tests, and review your latest scores.</p>
            </section>

            <section class="cards" id="testsGrid"></section>
        </main>
    </div>

    <script>
        const API_CANDIDATES = [5000, 5001, 5002, 5003, 5004, 5005].map(
            (port) => `http://${window.location.hostname || 'localhost'}:${port}/api`
        );

        let tests = [];

        async function fetchFromApi(path) {
            for (const base of API_CANDIDATES) {
                try {
                    const res = await fetch(`${base}${path}`);
                    if (!res.ok) continue;
                    return await res.json();
                } catch (_) {
                    // Try next candidate.
                }
            }
            throw new Error('Unable to connect to backend API (ports 5000-5005).');
        }

        function renderTests() {
            document.getElementById('testsGrid').innerHTML = tests.map((t) => `
                <article class="card">
                    <div class="row">
                        <div>
                            <div class="title">${t.title}</div>
                            <div class="course">${t.course}</div>
                        </div>
                        <span class="status ${t.status === 'upcoming' ? 'upcoming' : 'completed'}">${t.status}</span>
                    </div>
                    <div class="meta">
                        <div><strong>${t.totalQuestions}</strong>Questions</div>
                        <div><strong>${t.durationMinutes}m</strong>Duration</div>
                    </div>
                    ${t.status === 'completed'
                        ? `<div class="score">Score<br><strong>${t.score ?? 0}/100</strong><br>${t.updatedAt ? new Date(t.updatedAt).toLocaleDateString() : ''}</div><button class="btn alt">View Results</button>`
                        : `<div class="score">Scheduled<br><strong>${t.scheduledDate ? new Date(t.scheduledDate).toLocaleDateString() : 'TBD'}</strong></div><button class="btn">Start Test</button>`
                    }
                </article>
            `).join('');
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        }

        async function initTests() {
            try {
                const data = await fetchFromApi('/tests');
                tests = Array.isArray(data.tests) ? data.tests : [];
                renderTests();
            } catch (error) {
                document.getElementById('testsGrid').innerHTML = `
                    <article class="card" style="grid-column:1/-1;">
                        <div class="title">Could not load tests</div>
                        <div class="course">${error.message}</div>
                    </article>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', initTests);
    </script>
</body>
</html>
