<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests - CRISMATECH</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .tests-hero {
            background: linear-gradient(135deg, var(--primary-color), #0040a3);
            color: white;
            padding: 60px var(--spacing-xl);
            margin-bottom: var(--spacing-2xl);
        }

        .tests-hero h1 {
            margin: 0 0 var(--spacing-sm) 0;
            font-size: 36px;
            font-weight: 700;
        }

        .tests-hero p {
            margin: 0;
            opacity: 0.9;
            font-size: 16px;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--spacing-2xl);
            margin-bottom: var(--spacing-2xl);
        }

        .test-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            transition: all var(--transition-duration) ease;
            display: flex;
            flex-direction: column;
        }

        .test-card:hover {
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-4px);
        }

        .test-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .test-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: var(--spacing-xs);
        }

        .test-course {
            font-size: 13px;
            color: var(--text-light);
        }

        .test-body {
            padding: var(--spacing-lg);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .test-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
        }

        .test-info-item {
            text-align: center;
        }

        .test-info-label {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: var(--spacing-xs);
        }

        .test-info-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .test-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: var(--spacing-lg);
        }

        .status-upcoming {
            background: #FFF3E0;
            color: #E65100;
        }

        .status-completed {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .test-button {
            padding: var(--spacing-md);
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-duration) ease;
            margin-top: auto;
        }

        .test-button.start {
            background: var(--primary-color);
            color: white;
        }

        .test-button.start:hover {
            background: #003fa3;
        }

        .test-button.view {
            background: white;
            color: var(--primary-color);
            border: 1px solid var(--primary-light);
        }

        .test-button.view:hover {
            background: var(--primary-light);
        }

        @media (max-width: 768px) {
            .tests-hero h1 {
                font-size: 28px;
            }

            .test-grid {
                grid-template-columns: 1fr;
            }

            .test-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .test-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <span>CRISMATECH</span>
            </div>
            <ul class="navbar-menu">
                <li><a href="../dashboard.html">Dashboard</a></li>
                <li><a href="../courses/courses.html">Courses</a></li>
                <li><a href="../assignments/assignments.html">Assignments</a></li>
                <li><a href="test.html" style="color: var(--primary-color); font-weight: 700;">Tests</a></li>
                <li><a href="../certificate/certificate.html">Certificates</a></li>
            </ul>
            <div class="navbar-auth">
                <a href="../profile/profile.html" style="color: var(--text-dark); font-weight: 500;">Profile</a>
                <button class="btn-outline" onclick="logout()" style="padding: var(--spacing-sm) var(--spacing-lg);">Logout</button>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <div class="tests-hero">
        <h1>Tests & Assessments</h1>
        <p>Evaluate your knowledge and track your performance</p>
    </div>

    <!-- MAIN CONTENT -->
    <div class="dashboard-container">
        <!-- TESTS GRID -->
        <div class="test-grid" id="testsGrid">
            <!-- Tests will be inserted here -->
        </div>
    </div>

    <script>
        const tests = [
            {
                id: 1,
                title: "Web Dev Mid-Term Test",
                course: "Web Development",
                questions: 50,
                duration: 90,
                status: "completed",
                score: 87,
                scoreTotal: 100,
                date: "Feb 20, 2026"
            },
            {
                id: 2,
                title: "Python Programming Quiz",
                course: "Python Programming",
                questions: 30,
                duration: 60,
                status: "completed",
                score: 92,
                scoreTotal: 100,
                date: "Feb 25, 2026"
            },
            {
                id: 3,
                title: "IoT Fundamentals Test",
                course: "IoT Fundamentals",
                questions: 40,
                duration: 75,
                status: "upcoming",
                scheduleDate: "Mar 10, 2026"
            },
            {
                id: 4,
                title: "Machine Learning Mid-Term",
                course: "Machine Learning",
                questions: 45,
                duration: 120,
                status: "upcoming",
                scheduleDate: "Mar 15, 2026"
            },
            {
                id: 5,
                title: "Cybersecurity Assessment",
                course: "Cybersecurity Essentials",
                questions: 35,
                duration: 60,
                status: "completed",
                score: 85,
                scoreTotal: 100,
                date: "Mar 1, 2026"
            },
            {
                id: 6,
                title: "Cloud Computing Final",
                course: "Cloud Computing",
                questions: 50,
                duration: 120,
                status: "upcoming",
                scheduleDate: "Mar 20, 2026"
            }
        ];

        function renderTests() {
            const grid = document.getElementById('testsGrid');
            grid.innerHTML = tests.map(test => `
                <div class="test-card">
                    <div class="test-header">
                        <div>
                            <h3 class="test-title">${test.title}</h3>
                            <p class="test-course">${test.course}</p>
                        </div>
                    </div>
                    <div class="test-body">
                        <span class="test-status ${test.status === 'upcoming' ? 'status-upcoming' : 'status-completed'}">
                            ${test.status === 'upcoming' ? 'Scheduled' : 'Completed'}
                        </span>
                        <div class="test-info">
                            <div class="test-info-item">
                                <div class="test-info-label">Questions</div>
                                <div class="test-info-value">${test.questions}</div>
                            </div>
                            <div class="test-info-item">
                                <div class="test-info-label">Duration</div>
                                <div class="test-info-value">${test.duration}m</div>
                            </div>
                        </div>
                        ${test.status === 'completed' ? `
                            <div style="text-align: center; padding: var(--spacing-lg); background: var(--primary-light); border-radius: var(--border-radius); margin-bottom: var(--spacing-lg);">
                                <div style="font-size: 12px; color: var(--text-light); margin-bottom: var(--spacing-xs);">Your Score</div>
                                <div style="font-size: 28px; font-weight: 700; color: var(--primary-color);">${test.score}/${test.scoreTotal}</div>
                                <div style="font-size: 12px; color: var(--text-light); margin-top: var(--spacing-xs);">Completed: ${test.date}</div>
                            </div>
                            <button class="test-button view">View Results</button>
                        ` : `
                            <div style="text-align: center; padding: var(--spacing-lg); background: var(--bg-color); border-radius: var(--border-radius); margin-bottom: var(--spacing-lg);">
                                <div style="font-size: 12px; color: var(--text-light);">Scheduled for</div>
                                <div style="font-size: 16px; font-weight: 700; color: var(--text-dark); margin-top: var(--spacing-xs);">${test.scheduleDate}</div>
                            </div>
                            <button class="test-button start">Start Test</button>
                        `}
                    </div>
                </div>
            `).join('');
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '../login.html';
            }
        }

        // Initial render
        renderTests();
    </script>
</body>
</html>
