<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | CRISMATECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        :root {
            --navy-900: #0d1b36;
            --navy-800: #13264a;
            --surface: #ffffff;
            --bg: #f3f6fb;
            --text: #1f2b46;
            --muted: #6f7f9f;
            --line: #e6ecf5;
            --blue: #2f6bff;
            --shadow: 0 12px 30px rgba(17, 40, 89, 0.08);
            --radius: 14px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

        .shell { min-height: 100vh; display: grid; grid-template-columns: 250px 1fr; }
        .sidebar {
            background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
            color: #dce6ff;
            padding: 22px 14px;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .brand { padding: 10px 12px 22px; border-bottom: 1px solid rgba(255,255,255,0.12); margin-bottom: 14px; }
        .brand h1 { font-size: 1.05rem; color: #fff; }
        .brand p { color: #9fb1d8; font-size: 0.78rem; margin-top: 6px; }
        .nav a {
            display: flex; align-items: center; gap: 10px;
            color: #cad7f7; text-decoration: none; padding: 11px 12px;
            border-radius: 10px; margin-bottom: 4px; font-weight: 500; font-size: 0.92rem;
            transition: 0.2s ease;
        }
        .nav a:hover, .nav a.active { background: rgba(255,255,255,0.14); color: #fff; }

        .main { padding: 24px; }
        .hero {
            background: linear-gradient(135deg, #2f6bff 0%, #36a5ff 100%);
            color: #fff;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }
        .hero h2 { font-size: 1.35rem; }
        .hero p { margin-top: 6px; opacity: 0.95; font-size: 0.9rem; }

        .tools {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .search {
            display: flex; align-items: center; gap: 8px;
            background: #f8faff; border: 1px solid var(--line);
            border-radius: 9px; padding: 8px 10px; flex: 1; min-width: 220px; color: var(--muted);
        }
        .search input { border: 0; outline: 0; width: 100%; background: transparent; font-family: inherit; }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip {
            border: 1px solid var(--line); background: #f9fbff; color: #3b4d74;
            padding: 8px 10px; border-radius: 9px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 0.8rem;
        }
        .chip.active { background: #2f6bff; border-color: #2f6bff; color: #fff; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 11px;
        }

        .course {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .banner {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.65rem;
            font-weight: 700;
            position: relative;
        }
        .b1 { background: linear-gradient(135deg, #2f6bff, #35a2ff); }
        .b2 { background: linear-gradient(135deg, #19b878, #5fe2ad); }
        .b3 { background: linear-gradient(135deg, #f2a53a, #ffd07f); }
        .b4 { background: linear-gradient(135deg, #7f6bf5, #ae9dff); }

        .tag {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 0.68rem;
            font-weight: 700;
        }

        .body { padding: 11px; display: flex; flex-direction: column; gap: 7px; }
        .title { font-size: 0.94rem; font-weight: 700; }
        .instructor { color: var(--muted); font-size: 0.8rem; }
        .meta { color: #42557f; font-size: 0.76rem; }
        .btn {
            margin-top: 3px;
            border: 0;
            border-radius: 9px;
            padding: 8px;
            cursor: pointer;
            font-weight: 600;
            background: var(--blue);
            color: #fff;
            font-family: inherit;
            font-size: 0.8rem;
        }

        @media (max-width: 820px) {
            .shell { grid-template-columns: 1fr; }
            .sidebar { position: static; height: auto; }
            .main { padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="brand">
                <h1><i class="bi bi-mortarboard-fill"></i> CRISMATECH</h1>
                <p>Student Learning Portal</p>
            </div>
            <nav class="nav">
                <a href="../index.html"><i class="bi bi-house-door"></i> Home</a>
                <a href="../dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
                <a class="active" href="courses.html"><i class="bi bi-journal-bookmark"></i> Courses</a>
                <a href="../assignments/assignments.html"><i class="bi bi-file-earmark-check"></i> Assignments</a>
                <a href="../tests/test.html"><i class="bi bi-ui-checks-grid"></i> Tests</a>
                <a href="../certificate/certificate.html"><i class="bi bi-award"></i> Certificates</a>
                <a href="../profile/profile.html"><i class="bi bi-person"></i> Profile</a>
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </nav>
        </aside>

        <main class="main">
            <section class="hero">
                <h2>Explore Courses</h2>
                <p>Discover curated learning paths designed for practical skills and placements.</p>
            </section>

            <section class="tools">
                <label class="search">
                    <i class="bi bi-search"></i>
                    <input id="courseSearch" type="text" placeholder="Search by title, topic, instructor...">
                </label>
                <div class="chips">
                    <button class="chip active">All</button>
                    <button class="chip">Development</button>
                    <button class="chip">Data Science</button>
                    <button class="chip">Cloud</button>
                    <button class="chip">Security</button>
                </div>
            </section>

            <section class="grid" id="coursesGrid">
            </section>
        </main>
    </div>

    <script>
        const API_CANDIDATES = [5000, 5001, 5002, 5003, 5004, 5005].map(
            (port) => `http://${window.location.hostname || 'localhost'}:${port}/api`
        );

        const bannerClasses = ['b1', 'b2', 'b3', 'b4'];
        const tagByLevel = {
            Beginner: 'New',
            Intermediate: 'Popular',
            Advanced: 'Featured',
        };

        let allCourses = [];
        let currentCategory = 'all';

        async function fetchFromApi(path) {
            for (const base of API_CANDIDATES) {
                try {
                    const res = await fetch(`${base}${path}`);
                    if (!res.ok) continue;
                    return await res.json();
                } catch (_) {
                    // Try next candidate.
                }
            }
            throw new Error('Unable to connect to backend API (ports 5000-5005).');
        }

        function getIconLabel(title = '') {
            const words = title.split(' ').filter(Boolean);
            return (words[0] || 'CR').slice(0, 3).toUpperCase();
        }

        function renderCourses(courses) {
            const grid = document.getElementById('coursesGrid');

            if (!courses.length) {
                grid.innerHTML = `
                    <article class="course" style="grid-column:1/-1; padding:20px; text-align:center;">
                        <div class="body">
                            <div class="title">No courses found</div>
                            <div class="instructor">Try a different search or category.</div>
                        </div>
                    </article>
                `;
                return;
            }

            grid.innerHTML = courses
                .map((course, index) => {
                    const bannerClass = bannerClasses[index % bannerClasses.length];
                    const tag = tagByLevel[course.level] || 'Course';

                    return `
                        <article class="course">
                            <div class="banner ${bannerClass}">${getIconLabel(course.title)} <span class="tag">${tag}</span></div>
                            <div class="body">
                                <div class="title">${course.title}</div>
                                <div class="instructor">${course.instructor}</div>
                                <div class="meta">${course.lessons} lessons • ${course.durationHours} hours • ${course.level}</div>
                                <button class="btn">Enroll Now</button>
                            </div>
                        </article>
                    `;
                })
                .join('');
        }

        function applyFilters() {
            const query = document.getElementById('courseSearch').value.trim().toLowerCase();
            const filtered = allCourses.filter((course) => {
                const matchesCategory =
                    currentCategory === 'all' ||
                    (course.category || '').toLowerCase().includes(currentCategory);
                const matchesQuery =
                    !query ||
                    course.title.toLowerCase().includes(query) ||
                    (course.instructor || '').toLowerCase().includes(query) ||
                    (course.category || '').toLowerCase().includes(query);
                return matchesCategory && matchesQuery;
            });

            renderCourses(filtered);
        }

        async function initCourses() {
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = '<article class="course" style="grid-column:1/-1; padding:20px; text-align:center;"><div class="body"><div class="title">Loading courses...</div></div></article>';

            try {
                const data = await fetchFromApi('/courses');
                allCourses = Array.isArray(data.courses) ? data.courses : [];
                applyFilters();
            } catch (error) {
                grid.innerHTML = `
                    <article class="course" style="grid-column:1/-1; padding:20px; text-align:center;">
                        <div class="body">
                            <div class="title">Could not load courses</div>
                            <div class="instructor">${error.message}</div>
                        </div>
                    </article>
                `;
            }
        }

        document.getElementById('courseSearch').addEventListener('input', applyFilters);
        document.querySelectorAll('.chip').forEach((chip) => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.chip').forEach((c) => c.classList.remove('active'));
                chip.classList.add('active');
                currentCategory = chip.textContent.trim().toLowerCase();
                applyFilters();
            });
        });

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        }

        document.addEventListener('DOMContentLoaded', initCourses);
    </script>
</body>
</html>
