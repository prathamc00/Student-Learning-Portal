<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | CRISMATECH</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        .hero {
            background: var(--c-primary-gradient);
            background-size: 200% 200%;
            animation: gradientShift 6s ease infinite;
            color: #fff;
            border-radius: var(--r-xl);
            padding: var(--sp-6) var(--sp-8);
            margin-bottom: var(--sp-5);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, .07);
            border-radius: 50%;
            top: -50px;
            right: -30px;
            animation: float 6s ease-in-out infinite;
        }

        .hero h2 {
            font-size: var(--fs-2xl);
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .hero p {
            margin-top: 6px;
            opacity: 0.9;
            font-size: var(--fs-base);
            position: relative;
            z-index: 1;
        }

        .tools {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-sm);
            padding: var(--sp-3);
            display: flex;
            gap: var(--sp-3);
            flex-wrap: wrap;
            margin-bottom: var(--sp-5);
        }

        .search {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--c-bg);
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            padding: 10px 14px;
            flex: 1;
            min-width: 220px;
            transition: all var(--t-fast);
        }

        .search:focus-within {
            border-color: var(--c-primary);
            box-shadow: var(--shadow-glow);
        }

        .search input {
            border: 0;
            outline: 0;
            width: 100%;
            background: transparent;
            font-family: var(--font);
            font-size: var(--fs-base);
        }

        .chips {
            display: flex;
            gap: var(--sp-2);
            flex-wrap: wrap;
        }

        .chip {
            border: 1px solid var(--c-border);
            background: var(--c-surface);
            color: var(--c-text-secondary);
            padding: 8px 14px;
            border-radius: var(--r-full);
            cursor: pointer;
            font-family: var(--font);
            font-weight: 600;
            font-size: var(--fs-sm);
            transition: all var(--t-fast);
        }

        .chip:hover {
            border-color: var(--c-primary);
            color: var(--c-primary);
        }

        .chip.active {
            background: var(--c-primary-gradient);
            border-color: transparent;
            color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: var(--sp-4);
        }

        .course {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--r-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all .3s var(--ease);
            cursor: pointer;
        }

        .course:hover {
            box-shadow: var(--shadow-card-hover);
            transform: translateY(-6px) scale(1.01);
            border-color: var(--c-primary);
        }

        .banner {
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.8rem;
            font-weight: 800;
            position: relative;
        }

        .b1 {
            background: var(--c-primary-gradient);
        }

        .b2 {
            background: linear-gradient(135deg, #10B981, #34D399);
        }

        .b3 {
            background: linear-gradient(135deg, #F59E0B, #FBBF24);
        }

        .b4 {
            background: linear-gradient(135deg, #8B5CF6, #A78BFA);
        }

        .tag {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            border-radius: var(--r-full);
            background: rgba(255, 255, 255, .2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, .3);
            font-size: var(--fs-xs);
            font-weight: 700;
        }

        .body {
            padding: var(--sp-4);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .title {
            font-size: var(--fs-base);
            font-weight: 700;
        }

        .instructor {
            color: var(--c-text-muted);
            font-size: var(--fs-sm);
        }

        .meta {
            color: var(--c-text-secondary);
            font-size: var(--fs-xs);
        }
    </style>
</head>

<body>
    <div class="shell">
        <aside class="sidebar-modern">
            <div class="brand">
                <h4><i class="bi bi-mortarboard-fill"></i> CRISMATECH</h4>
                <small>Student Learning Portal</small>
            </div>
            <nav>
                <a href="../index.html"><i class="bi bi-house-door"></i> Home</a>
                <a href="../dashboard.html"><i class="bi bi-grid"></i> Dashboard</a>
                <a class="active" href="courses.html"><i class="bi bi-journal-bookmark"></i> Courses</a>
                <a href="../assignments/assignments.html"><i class="bi bi-file-earmark-check"></i> Assignments</a>
                <a href="../tests/test.html"><i class="bi bi-ui-checks-grid"></i> Tests</a>
                <a href="../certificate/certificate.html"><i class="bi bi-award"></i> Certificates</a>
                <a href="../profile/profile.html"><i class="bi bi-person"></i> Profile</a>
                <div class="nav-divider"></div>
                <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </nav>
        </aside>

        <main class="main-content page-fade">
            <section class="hero">
                <h2>Explore Courses</h2>
                <p>Discover curated learning paths designed for practical skills and placements.</p>
            </section>

            <section class="tools">
                <label class="search">
                    <i class="bi bi-search"></i>
                    <input id="courseSearch" type="text" placeholder="Search by title, topic, instructor...">
                </label>
                <div class="chips">
                    <button class="chip active">All</button>
                    <button class="chip">Development</button>
                    <button class="chip">Data Science</button>
                    <button class="chip">Cloud</button>
                    <button class="chip">Security</button>
                </div>
            </section>

            <section class="grid stagger-list" id="coursesGrid"></section>
        </main>
    </div>

    <script>
        const API_CANDIDATES = [5000, 5001, 5002, 5003, 5004, 5005].map(
            (port) => `http://${window.location.hostname || 'localhost'}:${port}/api`
        );
        const bannerClasses = ['b1', 'b2', 'b3', 'b4'];
        const tagByLevel = { Beginner: 'New', Intermediate: 'Popular', Advanced: 'Featured' };
        let allCourses = [];
        let currentCategory = 'all';

        async function fetchFromApi(path) {
            for (const base of API_CANDIDATES) {
                try { const res = await fetch(`${base}${path}`); if (!res.ok) continue; return await res.json(); } catch (_) { }
            }
            throw new Error('Unable to connect to backend API (ports 5000-5005).');
        }

        function getIconLabel(title = '') {
            const words = title.split(' ').filter(Boolean);
            return (words[0] || 'CR').slice(0, 3).toUpperCase();
        }

        function renderCourses(courses) {
            const grid = document.getElementById('coursesGrid');
            if (!courses.length) {
                grid.innerHTML = `<article class="course" style="grid-column:1/-1;padding:20px;text-align:center;"><div class="body"><div class="title">No courses found</div><div class="instructor">Try a different search or category.</div></div></article>`;
                return;
            }
            grid.innerHTML = courses.map((course, index) => {
                const bannerClass = bannerClasses[index % bannerClasses.length];
                const tag = tagByLevel[course.level] || 'Course';
                return `
                    <article class="course">
                        <div class="banner ${bannerClass}">${getIconLabel(course.title)} <span class="tag">${tag}</span></div>
                        <div class="body">
                            <div class="title">${course.title}</div>
                            <div class="instructor">${course.instructor}</div>
                            <div class="meta">${course.lessons} lessons • ${course.durationHours} hours • ${course.level}</div>
                            <button class="btn btn-primary w-100" style="margin-top: var(--sp-2);">Enroll Now</button>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function applyFilters() {
            const query = document.getElementById('courseSearch').value.trim().toLowerCase();
            const filtered = allCourses.filter((course) => {
                const matchesCategory = currentCategory === 'all' || (course.category || '').toLowerCase().includes(currentCategory);
                const matchesQuery = !query || course.title.toLowerCase().includes(query) || (course.instructor || '').toLowerCase().includes(query) || (course.category || '').toLowerCase().includes(query);
                return matchesCategory && matchesQuery;
            });
            renderCourses(filtered);
        }

        async function initCourses() {
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = '<article class="course" style="grid-column:1/-1;padding:20px;text-align:center;"><div class="body"><div class="title">Loading courses...</div></div></article>';
            try {
                const data = await fetchFromApi('/courses');
                allCourses = Array.isArray(data.courses) ? data.courses : [];
                applyFilters();
            } catch (error) {
                grid.innerHTML = `<article class="course" style="grid-column:1/-1;padding:20px;text-align:center;"><div class="body"><div class="title">Could not load courses</div><div class="instructor">${error.message}</div></div></article>`;
            }
        }

        document.getElementById('courseSearch').addEventListener('input', applyFilters);
        document.querySelectorAll('.chip').forEach((chip) => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.chip').forEach((c) => c.classList.remove('active'));
                chip.classList.add('active');
                currentCategory = chip.textContent.trim().toLowerCase();
                applyFilters();
            });
        });

        function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = '../login.html'; }
        document.addEventListener('DOMContentLoaded', initCourses);
    </script>
</body>

</html>
