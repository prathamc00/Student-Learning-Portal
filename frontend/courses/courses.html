<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - CRISMATECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .courses-hero {
            background: linear-gradient(135deg, var(--primary-color), #0040a3);
            color: white;
            padding: 60px var(--spacing-xl);
            margin-bottom: var(--spacing-2xl);
        }

        .courses-hero h1 {
            margin: 0 0 var(--spacing-sm) 0;
            font-size: 36px;
            font-weight: 700;
        }

        .courses-hero p {
            margin: 0;
            opacity: 0.9;
            font-size: 16px;
        }

        .filter-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-2xl);
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 14px;
            transition: border-color var(--transition-duration) ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 86, 210, 0.1);
        }

        .filter-buttons {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: var(--spacing-sm) var(--spacing-lg);
            border: 1px solid var(--border-color);
            background: white;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all var(--transition-duration) ease;
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-2xl);
            margin-bottom: var(--spacing-2xl);
        }

        .course-card {
            background: white;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            transition: all var(--transition-duration) ease;
        }

        .course-card:hover {
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-4px);
        }

        .course-image {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            color: white;
        }

        .course-body {
            padding: var(--spacing-lg);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .course-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            width: fit-content;
        }

        .course-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: var(--spacing-sm);
        }

        .course-instructor {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: var(--spacing-md);
        }

        .course-description {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: var(--spacing-md);
            flex: 1;
            line-height: 1.5;
        }

        .course-rating {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
            font-size: 13px;
        }

        .course-rating .stars {
            color: #FFB84D;
        }

        .course-rating .count {
            color: var(--text-light);
        }

        .course-progress {
            margin-bottom: var(--spacing-md);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: var(--spacing-xs);
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--primary-color);
        }

        .course-meta {
            display: flex;
            justify-content: space-between;
            gap: var(--spacing-md);
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
        }

        .course-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .course-button {
            padding: var(--spacing-sm) var(--spacing-lg);
            border: none;
            border-radius: var(--border-radius);
            background: var(--primary-color);
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background var(--transition-duration) ease;
        }

        .course-button:hover {
            background: #003fa3;
        }

        .course-button.outline {
            background: white;
            color: var(--primary-color);
            border: 1px solid var(--primary-light);
        }

        .course-button.outline:hover {
            background: var(--primary-light);
        }

        @media (max-width: 768px) {
            .courses-hero h1 {
                font-size: 28px;
            }

            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }

            .search-input {
                min-width: unset;
            }

            .filter-buttons {
                justify-content: flex-start;
                overflow-x: auto;
            }

            .courses-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <span>CRISMATECH</span>
            </div>
            <ul class="navbar-menu">
                <li><a href="../dashboard.html">Dashboard</a></li>
                <li><a href="courses.html" style="color: var(--primary-color); font-weight: 700;">Courses</a></li>
                <li><a href="../assignments/assignments.html">Assignments</a></li>
                <li><a href="../tests/test.html">Tests</a></li>
                <li><a href="../certificate/certificate.html">Certificates</a></li>
            </ul>
            <div class="navbar-auth">
                <a href="../profile/profile.html" style="color: var(--text-dark); font-weight: 500;">Profile</a>
                <button class="btn-outline" onclick="logout()" style="padding: var(--spacing-sm) var(--spacing-lg);">Logout</button>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <div class="courses-hero">
        <h1>Explore Courses</h1>
        <p>Discover and enroll in courses that match your learning goals</p>
    </div>

    <!-- MAIN CONTENT -->
    <div class="dashboard-container">
        <!-- FILTER SECTION -->
        <div class="filter-section">
            <input type="text" class="search-input" placeholder="Search courses..." id="searchInput">
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterCourses('all')">All Courses</button>
                <button class="filter-btn" onclick="filterCourses('enrolled')">Enrolled</button>
                <button class="filter-btn" onclick="filterCourses('completed')">Completed</button>
                <button class="filter-btn" onclick="filterCourses('available')">Available</button>
            </div>
        </div>

        <!-- COURSES GRID -->
        <div class="courses-grid" id="coursesGrid">
            <!-- Course cards will be inserted here -->
        </div>
    </div>

    <script>
        const coursesData = [
            {
                id: 1,
                title: "Web Development Masterclass",
                instructor: "Prof. Sharma",
                category: "Web Development",
                description: "Master HTML, CSS, JavaScript and build real-world projects from scratch.",
                rating: 5,
                reviews: 1203,
                lessons: 16,
                duration: "8 hrs",
                progress: 75,
                status: "enrolled",
                color: "linear-gradient(135deg, #667eea, #764ba2)",
                icon: "WEB"
            },
            {
                id: 2,
                title: "IoT Fundamentals",
                instructor: "Prof. Mehta",
                category: "IoT",
                description: "Understand sensors, actuators, and connect devices in a smart network.",
                rating: 4.5,
                reviews: 856,
                lessons: 20,
                duration: "12 hrs",
                progress: 45,
                status: "enrolled",
                color: "linear-gradient(135deg, #f093fb, #f5576c)",
                icon: "IOT"
            },
            {
                id: 3,
                title: "Python Programming",
                instructor: "Prof. Rao",
                category: "Programming",
                description: "Learn Python from scratch — variables, functions, OOP, and data handling.",
                rating: 5,
                reviews: 1450,
                lessons: 20,
                duration: "10 hrs",
                progress: 100,
                status: "completed",
                color: "linear-gradient(135deg, #4facfe, #00f2fe)",
                icon: "PYTHON"
            },
            {
                id: 4,
                title: "Machine Learning Basics",
                instructor: "Prof. Singh",
                category: "AI/ML",
                description: "Dive into supervised learning, models, and real-world ML applications.",
                rating: 5,
                reviews: 1100,
                lessons: 18,
                duration: "14 hrs",
                progress: 0,
                status: "available",
                color: "linear-gradient(135deg, #43e97b, #38f9d7)",
                icon: "ML"
            },
            {
                id: 5,
                title: "Cybersecurity Essentials",
                instructor: "Prof. Nair",
                category: "Security",
                description: "Protect systems and networks from threats with core security concepts.",
                rating: 4.5,
                reviews: 956,
                lessons: 15,
                duration: "9 hrs",
                progress: 0,
                status: "available",
                color: "linear-gradient(135deg, #fa709a, #fee140)",
                icon: "LOCK"
            },
            {
                id: 6,
                title: "Cloud Computing",
                instructor: "Prof. Kumar",
                category: "Cloud",
                description: "Understanding AWS, Azure, GCP and cloud deployment strategies.",
                rating: 5,
                reviews: 1400,
                lessons: 22,
                duration: "16 hrs",
                progress: 0,
                status: "available",
                color: "linear-gradient(135deg, #a18cd1, #fbc2eb)",
                icon: "CLOUD"
            }
        ];

        let currentFilter = 'all';

        function renderCourses(courses) {
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = courses.map(course => `
                <div class="course-card" data-status="${course.status}">
                    <div class="course-image" style="background: ${course.color};">${course.icon}</div>
                    <div class="course-body">
                        <div class="course-badge">${course.category}</div>
                        <h3 class="course-title">${course.title}</h3>
                        <p class="course-instructor">Instructor: ${course.instructor}</p>
                        <div class="course-rating">
                            <span class="stars">${'★'.repeat(Math.floor(course.rating))}${'☆'.repeat(5 - Math.floor(course.rating))}</span>
                            <span class="count">(${course.reviews.toLocaleString()})</span>
                        </div>
                        <p class="course-description">${course.description}</p>
                        ${course.progress > 0 ? `
                            <div class="course-progress">
                                <div style="display: flex; justify-content: space-between; margin-bottom: var(--spacing-xs);">
                                    <span style="font-size: 12px; color: var(--text-light);">Progress</span>
                                    <span style="font-size: 12px; font-weight: 600; color: var(--primary-color);">${course.progress}%</span>
                                </div>
                                <div class="progress-bar-container">
                                    <div class="progress-bar-fill" style="width: ${course.progress}%;"></div>
                                </div>
                            </div>
                        ` : ''}
                        <div class="course-meta">
                            <span>${course.lessons} Lessons</span>
                            <span>${course.duration}</span>
                        </div>
                        <div class="course-footer">
                            ${course.status === 'enrolled' ? 
                                `<button class="course-button">Continue →</button>` :
                                course.status === 'completed' ?
                                `<button class="course-button" disabled style="opacity: 0.7; cursor: not-allowed;">Completed</button>` :
                                `<button class="course-button outline">Enroll Now</button>`
                            }
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCourses(filter) {
            currentFilter = filter;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Filter courses
            let filtered = coursesData;
            if (filter !== 'all') {
                filtered = coursesData.filter(c => c.status === filter);
            }

            renderCourses(filtered);
        }

        function searchCourses() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = coursesData.filter(course => 
                course.title.toLowerCase().includes(query) ||
                course.category.toLowerCase().includes(query) ||
                course.instructor.toLowerCase().includes(query)
            );
            renderCourses(filtered);
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '../login.html';
            }
        }

        // Add search event listener
        document.getElementById('searchInput').addEventListener('input', searchCourses);

        // Initial render
        renderCourses(coursesData);
    </script>
</body>
</html>
