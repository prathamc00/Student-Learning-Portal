<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Player - CRISMATECH</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--c-dark);
            min-height: 100vh;
            color: #e2e8f0;
        }

        .topbar {
            background: #1e293b;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .topbar h1 {
            font-size: 1.1rem;
            color: #f1f5f9;
        }

        .topbar a {
            color: #A78BFA;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .player-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            min-height: calc(100vh - 56px);
        }

        .video-area {
            padding: 20px;
        }

        .video-container {
            background: #000;
            border-radius: 12px;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .video-placeholder {
            text-align: center;
            color: #64748b;
        }

        .video-placeholder i {
            font-size: 64px;
            margin-bottom: 12px;
            display: block;
        }

        .course-info h2 {
            font-size: 1.2rem;
            color: #f1f5f9;
            margin-bottom: 6px;
        }

        .course-info p {
            font-size: 13px;
            color: #94a3b8;
        }

        .module-sidebar {
            background: #1e293b;
            border-left: 1px solid #334155;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid #334155;
        }

        .sidebar-header h3 {
            font-size: 0.95rem;
            color: #f1f5f9;
        }

        .sidebar-header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .module-list {
            padding: 8px;
        }

        .module-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 4px;
        }

        .module-item:hover {
            background: #334155;
        }

        .module-item.active {
            background: #1e40af;
        }

        .module-item .num {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #334155;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .module-item.active .num {
            background: #3b82f6;
            color: #fff;
        }

        .module-item-info h4 {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .module-item-info p {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }

        .module-item-info .lesson-duration {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .module-item .video-icon {
            font-size: 14px;
            flex-shrink: 0;
        }

        .module-item .video-icon.has-video {
            color: #22c55e;
        }

        .module-item .video-icon.no-video {
            color: #64748b;
        }

        .enroll-section {
            padding: 20px;
            text-align: center;
            background: #1e293b;
            border-radius: 12px;
            margin: 20px;
        }

        .enroll-section h3 {
            margin-bottom: 12px;
        }

        .btn-enroll {
            background: #2f6bff;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-enroll:hover {
            background: #1d4ed8;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        @media (max-width: 768px) {
            .player-layout {
                grid-template-columns: 1fr;
            }

            .module-sidebar {
                border-left: none;
                border-top: 1px solid #334155;
            }
        }
    </style>
</head>

<body>
    <div class="topbar">
        <h1 id="courseTitle"><i class="bi bi-play-circle"></i> Loading Course...</h1>
        <a href="../dashboard.html">← Dashboard</a>
    </div>
    <div class="player-layout">
        <div class="video-area">
            <div class="video-container" id="videoContainer">
                <div class="video-placeholder"><i class="bi bi-play-circle"></i>
                    <p>Select a module to start watching</p>
                </div>
            </div>
            <div class="course-info">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <h2 id="moduleTitle">Select a Module</h2>
                        <p id="moduleDesc">Click on a module from the sidebar to start learning.</p>
                    </div>
                    <div id="notesDownloadContainer" style="display: none;">
                        <a id="downloadNotesBtn" href="#" target="_blank" style="background: rgba(13, 202, 240, 0.1); border: 1px solid #0dcaf0; color: #0dcaf0; padding: 6px 16px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s;">
                            <i class="bi bi-file-earmark-pdf"></i> Download PDF Notes
                        </a>
                    </div>
                </div>
            </div>
            <div id="enrollSection" style="display:none;">
                <div class="enroll-section">
                    <h3>Enroll in this course to track your progress</h3>
                    <button class="btn-enroll" onclick="enrollCourse()"><i class="bi bi-plus-circle"></i> Enroll
                        Now</button>
                </div>
            </div>
        </div>
        <aside class="module-sidebar">
            <div class="sidebar-header">
                <h3>Course Lessons</h3>
                <p id="moduleCount">0 lessons</p>
            </div>
            <div class="module-list" id="moduleList">
                <div class="empty-state"><i class="bi bi-journal-x"></i>
                    <p>No modules yet</p>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const API_CANDIDATES = [5000, 5001, 5002, 5003, 5004, 5005].map(p => `http://${window.location.hostname || 'localhost'}:${p}/api`);
        let apiBase = null;
        async function getApiBase() {
            if (apiBase) return apiBase;
            for (const b of API_CANDIDATES) { try { const r = await fetch(`${b}/courses`); if (r.ok) { apiBase = b; return b; } } catch (_) { } }
            throw new Error('Unable to connect to backend API.');
        }
        function getToken() { return localStorage.getItem('token'); }

        const params = new URLSearchParams(window.location.search);
        const courseId = params.get('id');
        let course = null;

        async function loadCourse() {
            if (!courseId) { document.getElementById('courseTitle').textContent = 'No course selected'; return; }
            const base = await getApiBase();
            const res = await fetch(`${base}/courses/${courseId}`);
            const data = await res.json();
            if (!data.success || !data.course) { document.getElementById('courseTitle').textContent = 'Course not found'; return; }
            course = data.course;
            document.getElementById('courseTitle').innerHTML = `<i class="bi bi-play-circle"></i> ${course.title}`;
            document.getElementById('moduleCount').textContent = `${(course.modules || []).length} modules`;

            // Check enrollment
            const token = getToken();
            if (token) {
                try {
                    const userRes = await fetch(`${base}/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                    const userData = await userRes.json();
                    if (userData.success) {
                        const enrolled = (userData.user.enrolledCourses || []).some(c => (c._id || c) === courseId);
                        if (!enrolled) document.getElementById('enrollSection').style.display = 'block';
                    }
                } catch (_) { }
            }

            renderModules();
        }

        function renderModules() {
            const list = document.getElementById('moduleList');
            if (!course.modules || !course.modules.length) {
                list.innerHTML = '<div class="empty-state"><i class="bi bi-journal-x"></i><p>No lessons available yet</p></div>';
                return;
            }
            // Sort by order field
            const sorted = [...course.modules].sort((a, b) => (a.order || 0) - (b.order || 0));
            course.modules = sorted;
            document.getElementById('moduleCount').textContent = `${sorted.length} lesson${sorted.length !== 1 ? 's' : ''}`;
            list.innerHTML = sorted.map((m, i) => {
                const hasVideo = !!m.videoUrl;
                return `
                <div class="module-item" id="mod-${i}" onclick="playModule(${i})">
                    <div class="num">${i + 1}</div>
                    <div class="module-item-info">
                        <h4>${m.title}</h4>
                        <p>${m.description || 'Lesson ' + (i + 1)}</p>
                        ${m.duration ? `<div class="lesson-duration"><i class="bi bi-clock"></i> ${m.duration}</div>` : ''}
                    </div>
                    <i class="bi ${hasVideo ? 'bi-play-circle-fill video-icon has-video' : 'bi-film video-icon no-video'}"></i>
                </div>`;
            }).join('');
        }

        async function playModule(idx) {
            const m = course.modules[idx];
            if (!m) return;

            // Update selection
            document.querySelectorAll('.module-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`mod-${idx}`).classList.add('active');

            document.getElementById('moduleTitle').textContent = m.title;
            document.getElementById('moduleDesc').textContent = m.description || '';

            const notesContainer = document.getElementById('notesDownloadContainer');
            const notesBtn = document.getElementById('downloadNotesBtn');
            if (m.notesUrl) {
                notesContainer.style.display = 'block';
                getApiBase().then(base => {
                    notesBtn.href = m.notesUrl.startsWith('http') ? m.notesUrl : `${base.replace('/api', '')}/${m.notesUrl}`;
                });
            } else {
                notesContainer.style.display = 'none';
            }

            const container = document.getElementById('videoContainer');
            if (m.videoUrl) {
                const base = await getApiBase();
                const videoSrc = m.videoUrl.startsWith('http') ? m.videoUrl : `${base.replace('/api', '')}/${m.videoUrl}`;
                container.innerHTML = `<video controls autoplay><source src="${videoSrc}" type="video/mp4">Your browser does not support the video tag.</video>`;
            } else {
                container.innerHTML = '<div class="video-placeholder"><i class="bi bi-film"></i><p>No video available for this module</p></div>';
            }

            // Track video watch attendance
            const token = getToken();
            if (token) {
                try {
                    const base = await getApiBase();
                    await fetch(`${base}/attendance`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ courseId: course._id, activityType: 'video_watch', details: `Watched: ${m.title}` }),
                    });
                } catch (_) { }
            }
        }

        async function enrollCourse() {
            const token = getToken();
            if (!token) { alert('Please login first'); window.location.href = '../login.html'; return; }
            const base = await getApiBase();
            try {
                const res = await fetch(`${base}/auth/me/enroll/${courseId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                });
                const data = await res.json();
                if (data.success) {
                    alert('Enrolled successfully!');
                    document.getElementById('enrollSection').style.display = 'none';
                } else { alert(data.message || 'Failed to enroll'); }
            } catch (e) { alert('Server error'); }
        }

        document.addEventListener('DOMContentLoaded', loadCourse);
    </script>
</body>

</html>
